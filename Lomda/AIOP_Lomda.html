  <style>
    :root {
      --bg: #0b1622; --bg-2: #112c3b;
      --surface: rgba(255,255,255,0.04); --surface-2: rgba(255,255,255,0.07);
      --border: rgba(81,196,211,0.2); --border-strong: rgba(81,196,211,0.5);
      --accent: #51c4d3; --accent-2: #2563eb;
      --text: #e2e8f0; --text-dim: #8a9cae;
      --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-2) 0%, var(--bg) 70%);
      color: var(--text);
      font-family: 'Heebo','Inter',system-ui,sans-serif;
      min-height: 100vh; overflow-x: hidden;
    }
    html[dir="ltr"] body { font-family: 'Inter','Heebo',system-ui,sans-serif; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes zoomIn { from{transform:scale(0.95);opacity:0} to{transform:scale(1);opacity:1} }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(81,196,211,0.7)} 50%{box-shadow:0 0 0 12px rgba(81,196,211,0)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    .slide-up { animation: slideUp 0.5s ease-out; }
    .zoom-in { animation: zoomIn 0.35s ease-out; }
    .float { animation: float 4s ease-in-out infinite; }

    .glass {
      background: var(--surface);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
    }
    .glow-border { box-shadow: 0 0 24px rgba(81,196,211,0.15); border: 1px solid var(--border-strong); }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; justify-content: center;
      padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; transition: all 0.2s; border: none; user-select: none;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; box-shadow: 0 4px 20px rgba(81,196,211,0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(81,196,211,0.45); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-ghost { background: rgba(255,255,255,0.05); color: var(--text); border:1px solid rgba(255,255,255,0.1); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
    .btn-outline { background:transparent; color:var(--accent); border:1.5px solid var(--accent); }
    .btn-outline:hover { background:rgba(81,196,211,0.1); }

    .channel-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 28px 20px; cursor: pointer; transition: all 0.25s ease;
      text-align: center;
    }
    .channel-card:hover { background: rgba(30,41,59,0.6); border-color: var(--border-strong); box-shadow: 0 0 20px rgba(81,196,211,0.2); transform: translateY(-4px); }
    .channel-card.active { border-color: var(--accent); box-shadow: 0 0 24px rgba(81,196,211,0.4); }

    .portal-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 40px 28px; cursor: pointer; transition: all 0.3s ease;
      text-align: center; min-height: 240px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .portal-card:hover { background: rgba(30,41,59,0.6); border-color: var(--border-strong); transform: translateY(-6px); box-shadow: 0 12px 40px rgba(81,196,211,0.25); }
    .portal-icon {
      width: 72px; height: 72px; border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      color: #fff; margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(81,196,211,0.3);
    }

    .hotspot {
      position: absolute; width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); color: #0b1622;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; cursor: pointer;
      animation: pulse 2s infinite; border: 2px solid #fff; z-index: 5;
    }
    .hotspot.done { background: var(--success); color: #fff; animation: none; }

    .progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 0.4s ease; }

    .chapter-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.15); transition: all 0.2s; cursor: pointer; }
    .chapter-dot.active { background: var(--accent); transform: scale(1.4); }
    .chapter-dot.done { background: var(--success); }

    .mock-screen { background: #0d1f2d; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; position: relative; }
    .mock-header { background: rgba(255,255,255,0.04); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .mock-search { background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; color: var(--text-dim); font-size: 13px; flex: 1; max-width: 400px; display: flex; align-items: center; gap: 8px; }

    .quiz-option { background: rgba(255,255,255,0.04); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 18px; cursor: pointer; transition: all 0.2s; text-align: start; color: var(--text); font-weight: 500; }
    .quiz-option:hover { border-color: var(--border-strong); background: rgba(81,196,211,0.08); }
    .quiz-option.correct { border-color: var(--success); background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .quiz-option.wrong { border-color: var(--danger); background: rgba(239,68,68,0.12); color: #fca5a5; }
    .quiz-option:disabled { cursor: default; }

    .tooltip { position: absolute; background: #0d1f2d; color: var(--text); border: 1px solid var(--border-strong); border-radius: 10px; padding: 10px 14px; font-size: 13px; max-width: 240px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 10; pointer-events: none; }

    .checklist-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; color: var(--text); }
    .check-icon { width: 28px; height: 28px; border-radius: 50%; background: rgba(16,185,129,0.15); border: 2px solid var(--success); display: flex; align-items: center; justify-content: center; color: var(--success); flex-shrink: 0; font-weight: 800; }

    .aiop-logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.4rem; color: #fff; letter-spacing: 0.5px; }
    .aiop-logo-mark { position: relative; background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(81,196,211,0.4); }
    .aiop-logo-mark::before { content:''; position:absolute; inset:4px; border:2px solid rgba(255,255,255,0.85); border-radius:6px; }
    .aiop-logo-mark::after { content:''; position:absolute; width:8px; height:8px; background:#fff; border-radius:50%; }

    /* Marketing-only */
    .mkt-section { padding: 80px 24px; max-width: 1200px; margin: 0 auto; }
    .mkt-eyebrow { color: var(--accent); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 12px; }
    .mkt-hero-bg { background: radial-gradient(ellipse at 50% 0%, rgba(81,196,211,0.18) 0%, transparent 60%); }
    .stat-num { font-size: 2.6rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .pain-row { display: flex; align-items: start; gap: 14px; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .pain-row:last-child { border-bottom: none; }
    .pain-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(239,68,68,0.12); color: #fca5a5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .feature-card { background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 28px; transition: all 0.25s ease; }
    .feature-card:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.05); }
    .feature-icon { width: 48px; height: 48px; border-radius: 12px; background: rgba(81,196,211,0.12); color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .step-card { background: var(--surface); border-radius: 18px; padding: 32px; border: 1px solid rgba(255,255,255,0.06); position: relative; }
    .step-num { position: absolute; top: -18px; inset-inline-start: 24px; width: 44px; height: 44px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 800; font-size: 1.3rem; border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(81,196,211,0.3); }

    html[dir="rtl"] .docs-search input { padding: 16px 20px 16px 50px; }
    .docs-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(81,196,211,0.15); }
    .docs-search .docs-search-icon { position: absolute; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
    html[dir="rtl"] .docs-search .docs-search-icon { left: 18px; }
    html[dir="ltr"] .docs-search .docs-search-icon { right: 18px; }
    .docs-sidebar { background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 18px; }

    .docs-cat-item { display: block; padding: 8px 12px; border-radius: 8px; color: var(--text); font-size: 0.9rem; cursor: pointer; transition: all 0.15s; }

    .docs-card { background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 20px; cursor: pointer; transition: all 0.2s; }
    .docs-card:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.05); transform: translateY(-2px); }
    .docs-card .cat-tag { display: inline-block; font-size: 0.7rem; font-weight: 700; color: var(--accent); background: rgba(81,196,211,0.1); padding: 3px 8px; border-radius: 6px; margin-bottom: 10px; }
    .docs-article { background: var(--surface); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 36px; }
    .docs-article h1 { color: #fff; font-size: 2rem; font-weight: 800; margin: 0 0 8px; }
    .docs-article h2 { color: #fff; font-size: 1.3rem; font-weight: 700; margin: 28px 0 12px; }
    .docs-article p { color: var(--text); line-height: 1.7; margin: 0 0 14px; }
    .docs-article ul { color: var(--text); line-height: 1.7; padding-inline-start: 22px; margin: 0 0 14px; }
    .docs-article code { background: rgba(255,255,255,0.07); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; color: var(--accent); font-family: 'Consolas', monospace; }
    .docs-article pre { background: #0a131c; border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; padding: 14px; overflow: auto; color: var(--text); font-size: 0.85rem; direction: ltr; text-align: left; }
    .docs-article pre code { background: transparent; padding: 0; color: var(--text); }

    @media (max-width: 768px) {
      .channel-card { padding: 20px 14px; }
      .mkt-section { padding: 50px 18px; }
    }
  </style>

  <script>
    function loadScript(urls, name, cb) {
      var i = 0;
      function tryNext() {
        if (i >= urls.length) { cb(new Error(name + ' failed all CDNs')); return; }
        var s = document.createElement('script');
        s.src = urls[i++]; s.crossOrigin = 'anonymous';
        s.onload = function(){ cb(null); };
        s.onerror = function(){ tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    }
    function showError(msg) {
      var el = document.getElementById('root') || document.body;
      var box = document.createElement('div');
      box.style.cssText = 'background:#111;color:#fca5a5;padding:20px;margin:20px;border:1px solid #ef4444;border-radius:8px;font-family:monospace;font-size:13px;white-space:pre-wrap;direction:ltr;text-align:left;';
      box.textContent = msg;
      el.parentNode.insertBefore(box, el);
    }
    window.addEventListener('error', function(e) {
      var msg = (e.error && e.error.stack) ? e.error.stack : (e.message + ' at ' + (e.filename||'') + ':' + (e.lineno||''));
      showError('JS ERROR:\n' + msg);
    });
    loadScript([
      'https://unpkg.com/react@18/umd/react.production.min.js',
      'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'
    ], 'React', function(err){
      if (err) { showError(err.message); return; }
      loadScript([
        'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
        'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js'
      ], 'ReactDOM', function(err){
        if (err) { showError(err.message); return; }
        loadScript([
          'https://unpkg.com/@babel/standalone/babel.min.js',
          'https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js'
        ], 'Babel', function(err){
          if (err) { showError(err.message); return; }
          var src = document.getElementById('app-source').textContent;
          try {
            var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
            (0, eval)(out);
          } catch (e) {
            showError('Babel/eval error:\n' + (e.stack || e.message));
          }
        });
      });
    });
  </script>

            ["p","Backend היה מוסיף עלות, סיבוך הפצה, ותלות באינטרנט. עבור רוב הלקוחות, נפח הנתונים יושב על MB בודדים — זמין כקבועים בתוך הקובץ. אם יידרש בעתיד מעקב או סנכרון, אפשר לעטוף ב-LMS תקני (SCORM, xAPI) או להוסיף שכבת API."],
            ["h2","CDN וכישלון אופליין"],
            ["p","הטעינה הראשונה דורשת חיבור לרשת (לטעינת ה-CDNs). לאחר מכן, הדפדפן שומר את הקבצים במטמון ויפעל אופליין. בגרסאות \"אופליין-לעולם\", ניתן להטמיע את ה-CDNs ישירות בקובץ — זה מגדיל אותו אבל מסיר כל תלות."]
          ],
          en:[
            ["p","AIOP is delivered as a single HTML file containing all logic, styling, content and data. The single-file choice stems from operational needs: portability, offline, simple distribution."],
            ["h2","File layers"],
            ["ul",["CDN layer — React, Babel, Tailwind loaded from content providers","CSS layer — custom styles, themes, animations","Content layer — JSON objects: FLOW_DATA, DOCS, I18N","Logic layer — React components composing the UI"]],
            ["h2","Why no backend?"],
            ["p","A backend would add cost, distribution complexity, and internet dependence. For most customers, data volume fits in a few MB — available as constants inside the file. If future tracking or sync is needed, wrap in a standard LMS (SCORM, xAPI) or add an API layer."],
            ["h2","CDNs and full offline"],
            ["p","First load requires internet (to fetch CDNs). After that, the browser caches the files and works offline. For \"always-offline\" builds, you can inline the CDN libs directly — larger file but no external deps."]
          ]
        }
      },
      { slug:"channels-model", cat:"arch",
        title:{ he:"5 הערוצים — מודל לוגי", en:"The 5 Channels — Logical Model" },
        summary:{ he:"איך הערוצים בנויים מבחינה מבנית, ולמה דווקא חמישה.", en:"How the channels are structured, and why five." },
        body:{
          he:[
            ["p","המודל של חמשת הערוצים נבחר אחרי מיפוי של עשרות צרכי תפעול חוזרים. כל ערוץ מייצג מצב מנטלי שונה של המשתמש: \"איך פותרים\", \"איפה כתוב\", \"איך לומדים\", \"איך מחשבים\", \"מה השאלה הראשונה\"."],
            ["h2","מבנה לוגי של ערוץ"],
            ["p","כל ערוץ מורכב מ-Nodes (צמתים) בעץ. כל Node מכיל: id, title, type, content, ולעיתים targets (יעדים לערוצים אחרים)."],
            ["pre","type Node = {\n  id: string;\n  type: 'landing' | 'question' | 'solution' | 'doc' | 'video';\n  title: string;\n  text?: string;\n  options?: { label: string; targetId: string }[];\n  media?: { type: 'image'|'video'; url: string };\n};"],
            ["h2","מעבר בין ערוצים"],
            ["p","ערוצים יכולים להפנות זה אל זה. למשל, פתרון ב-Troubleshooting יכול להפנות למסמך טכני, או FAQ יכול להפנות לסרטון הדרכה. זה מה שהופך את AIOP ל-\"All In One Place\" אמיתי."]
          ],
          en:[
            ["p","The five-channel model was picked after mapping dozens of recurring ops needs. Each channel represents a different mental state of the user: \"how do I fix\", \"where is it documented\", \"how do I learn\", \"how do I calculate\", \"what's the first question\"."],
            ["h2","Logical channel structure"],
            ["p","Each channel is composed of Nodes in a tree. Each Node holds: id, title, type, content, and sometimes targets (cross-channel references)."],
            ["pre","type Node = {\n  id: string;\n  type: 'landing' | 'question' | 'solution' | 'doc' | 'video';\n  title: string;\n  text?: string;\n  options?: { label: string; targetId: string }[];\n  media?: { type: 'image'|'video'; url: string };\n};"],
            ["h2","Cross-channel references"],
            ["p","Channels can reference each other. For instance, a Troubleshooting solution can link to a Technical Manual, or an FAQ can link to a training video. This is what makes AIOP truly \"All In One Place\"."]
          ]
        }
      },
      { slug:"adding-topics", cat:"content",
        title:{ he:"הוספת נושא חדש לערוץ", en:"Adding a Topic to a Channel" },
        summary:{ he:"איך מוסיפים נושא או מסמך חדש לכל אחד מהערוצים.", en:"How to add a new topic or document to any channel." },
        body:{
          he:[
            ["p","הוספת נושא חדש מתבצעת על-ידי עריכת מבנה הנתונים של הערוץ הרלוונטי. עבור הלקוחות שלנו, אנחנו מטפלים בעדכונים — אבל למי שרוצה לערוך עצמאית, השלבים פשוטים."],
            ["h2","Troubleshooting"],
            ["p","ערכו את ה-FLOW_DATA והוסיפו צומת חדש עם id ייחודי, סוג (question / solution), והפניות אם יש."],
            ["pre","window.__FLOW_DATA__['new_node_id'] = {\n  id: 'new_node_id',\n  type: 'question',\n  title: 'האם המכ\"ם מקבל מתח?',\n  options: [\n    { label: 'כן', targetId: 'next_step' },\n    { label: 'לא', targetId: 'power_issue' }\n  ]\n};"],
            ["h2","Manuals / FAQs / Utilities"],
            ["p","פותחים את אובייקט DOCS, מוסיפים אובייקט עם slug, cat (קטגוריה), title, summary ו-body. ה-body מבוסס על מערך של בלוקים: paragraph, heading, list, code."],
            ["h2","שמירה"],
            ["p","אחרי העריכה — שומרים את הקובץ ושולחים מחדש למשתמשים. מכיוון שזה קובץ HTML יחיד, אין צורך ב-CI/CD או deployments."]
          ],
          en:[
            ["p","Adding a new topic is done by editing the data structure of the relevant channel. For our customers, we handle updates — but for self-editing, the steps are simple."],
            ["h2","Troubleshooting"],
            ["p","Edit FLOW_DATA and add a new node with a unique id, type (question / solution), and references if any."],
            ["pre","window.__FLOW_DATA__['new_node_id'] = {\n  id: 'new_node_id',\n  type: 'question',\n  title: 'Is the radar receiving power?',\n  options: [\n    { label: 'Yes', targetId: 'next_step' },\n    { label: 'No', targetId: 'power_issue' }\n  ]\n};"],
            ["h2","Manuals / FAQs / Utilities"],
            ["p","Open the DOCS object, add an entry with slug, cat (category), title, summary and body. Body is an array of blocks: paragraph, heading, list, code."],
            ["h2","Saving"],
            ["p","After editing — save and redistribute. Since it's a single HTML file, no CI/CD or deployments required."]
          ]
        }
      },
      { slug:"troubleshooting-tree", cat:"content",
        title:{ he:"בניית עץ Troubleshooting", en:"Building a Troubleshooting Tree" },
        summary:{ he:"שיטות עבודה לבניית עץ אבחון יעיל לתחום שלכם.", en:"Methodologies for building an efficient diagnostic tree for your domain." },
        body:{
          he:[
            ["p","עץ Troubleshooting טוב חוסך זמן יקר לטכנאים. עץ רע גורם להם להסתבך עוד יותר. הנה כללי האצבע שאנחנו מיישמים."],
            ["h2","1. תתחילו מהתסמין, לא מהגורם"],
            ["p","טכנאים מגיעים עם תקלה (\"המכשיר לא נדלק\"), לא עם השערה. בנו את העץ מהתסמין למטה — לא להפך."],
            ["h2","2. שאלות בינאריות עדיפות"],
            ["p","שאלות כן/לא קלות לאבחון. שאלות \"איזה מהבאים\" יכולות להציע 5 אפשרויות אבל רק כשיש דיפרנציאל ברור."],
            ["h2","3. עד 5 שכבות עומק"],
            ["p","אם הגעת לשכבה השביעית — כנראה שצריך לפצל לעץ-משנה או להפנות למסמך טכני. עומק רב מבלבל."],
            ["h2","4. כל עלה מוביל לפעולה"],
            ["p","אסור שיהיו עלים שאומרים \"קשה לדעת\". כל עלה חייב לתת אבחנה ופעולה — גם אם זה \"שלחו לבדיקה\"."]
          ],
          en:[
            ["p","A good Troubleshooting tree saves precious time for technicians. A bad one gets them more stuck. Here are our rules of thumb."],
            ["h2","1. Start from the symptom, not the cause"],
            ["p","Technicians come with a failure (\"device won't turn on\"), not a hypothesis. Build the tree top-down from the symptom — not the other way."],
            ["h2","2. Binary questions are better"],
            ["p","Yes/no questions are easy to diagnose. \"Which of the following\" can present 5 options but only when the differential is clear."],
            ["h2","3. Up to 5 layers deep"],
            ["p","If you've reached the seventh layer — you probably need to split into a sub-tree or link to a technical document. Excessive depth is confusing."],
            ["h2","4. Every leaf leads to an action"],
            ["p","No leaves that say \"hard to tell\". Every leaf must give a diagnosis and an action — even if it's \"send for inspection\"."]
          ]
        }
      },
      { slug:"themes", cat:"brand",
        title:{ he:"ערכות צבעים (Themes)", en:"Themes & Color Palettes" },
        summary:{ he:"איך מחליפים ערכת צבעים שלמה ולמה מומלץ להיצמד למספר ערכות מובנות.", en:"How to swap a whole color theme and why to stick to built-in palettes." },
        body:{
          he:[
            ["p","AIOP מגיעה עם 5 ערכות צבעים מובנות: Classic (לבן), Corporate (כחול), Dark (כהה), Green, Stitch Modern (ציאן-לילה). החלפת ערכה מתבצעת על-ידי שינוי משתנה בודד."],
            ["h2","משתני CSS"],
            ["p","כל ערכת צבעים מוגדרת כאוסף של 6 משתני CSS: --theme-header, --theme-header-text, --theme-bg, --theme-accent, --theme-card, --theme-card-border."],
            ["pre",":root {\n  --theme-header: #1e293b;\n  --theme-header-text: #ffffff;\n  --theme-bg: #f8fafc;\n  --theme-accent: #2563eb;\n  --theme-card: #ffffff;\n  --theme-card-border: #e2e8f0;\n}"],
            ["h2","הוספת ערכה מותאמת"],
            ["p","אפשר להוסיף ערכה מותאמת ללקוח — בדרך כלל כדי להתאים לצבעי המותג. אבל זהירות: ניגודיות נמוכה פוגעת בנגישות. אנחנו מעדיפים להיצמד לערכות המובנות עם התאמות עדינות."]
          ],
          en:[
            ["p","AIOP ships with 5 built-in themes: Classic (light), Corporate (blue), Dark, Green, Stitch Modern (cyan-night). Swapping a theme is done by changing a single variable."],
            ["h2","CSS variables"],
            ["p","Each theme is defined as 6 CSS variables: --theme-header, --theme-header-text, --theme-bg, --theme-accent, --theme-card, --theme-card-border."],
            ["pre",":root {\n  --theme-header: #1e293b;\n  --theme-header-text: #ffffff;\n  --theme-bg: #f8fafc;\n  --theme-accent: #2563eb;\n  --theme-card: #ffffff;\n  --theme-card-border: #e2e8f0;\n}"],
            ["h2","Adding a custom theme"],
            ["p","You can add a custom theme per customer — usually to match brand colors. But beware: low contrast hurts accessibility. We prefer sticking to built-in themes with subtle tweaks."]
          ]
        }
      },
      { slug:"customer-logo", cat:"brand",
        title:{ he:"לוגו לקוח ומיתוג", en:"Customer Logo & Branding" },
        summary:{ he:"איך להחליף את הלוגו והמיתוג של הלקוח בקובץ AIOP.", en:"How to swap customer logo and branding in the AIOP file." },
        body:{
          he:[
            ["p","המיתוג של AIOP מורכב משלושה רכיבים: לוגו AIOP (קבוע), לוגו לקוח (משתנה), וערכת צבעים. כל אחד ניתן להחלפה עצמאית."],
            ["h2","איפה הלוגו של הלקוח"],
            ["p","בקובץ landingConfig של ה-FLOW_DATA הראשי, יש שדה logoUrl ו-heroImage. אלו מציינים את כתובות התמונות שיופיעו במסך הפתיחה ובכותרת."],
            ["pre","landingConfig: {\n  logoUrl: 'https://your-cdn/logo.png',\n  logoHeight: 48,\n  heroImage: 'https://your-cdn/hero.png',\n  heroHeight: 200\n}"],
            ["h2","ניהול הנכסים"],
            ["p","מומלץ לארח את התמונות ב-CDN ציבורי (לדוגמה: GitHub Pages, Cloudflare Images). זה מאפשר עדכון לוגו ללא ייצור-מחדש של קובץ HTML. עבור לקוחות שדורשים אופליין מלא — מטמיעים את התמונה כ-base64."]
          ],
          en:[
            ["p","AIOP branding consists of three components: AIOP logo (fixed), customer logo (variable), and color theme. Each is swappable independently."],
            ["h2","Where the customer logo lives"],
            ["p","In the landingConfig field of the root FLOW_DATA, there are logoUrl and heroImage fields. These specify image URLs shown on the landing screen and in the header."],
            ["pre","landingConfig: {\n  logoUrl: 'https://your-cdn/logo.png',\n  logoHeight: 48,\n  heroImage: 'https://your-cdn/hero.png',\n  heroHeight: 200\n}"],
            ["h2","Asset hosting"],
            ["p","We recommend hosting images on a public CDN (e.g. GitHub Pages, Cloudflare Images). This lets you update the logo without regenerating the HTML. For full-offline customers — embed images as base64."]
          ]
        }
      },
      { slug:"rtl-ltr", cat:"i18n",
        title:{ he:"תמיכה בעברית ואנגלית (RTL/LTR)", en:"Hebrew & English (RTL/LTR) Support" },
        summary:{ he:"איך AIOP מטפלת בעברית, אנגלית, והחלפה ביניהן.", en:"How AIOP handles Hebrew, English, and switching between them." },
        body:{
          he:[
            ["p","AIOP נבנתה דו-לשונית מהיסוד. כל מחרוזת נמצאת באובייקט I18N תחת שני מפתחות: he ו-en. ההחלפה מתבצעת בכפתור עליון, והכיוון של המסמך מתחלף אוטומטית בין rtl ל-ltr."],
            ["h2","הוספת שפה שלישית"],
            ["p","ניתן להוסיף שפות נוספות (ערבית, רוסית, צרפתית) על-ידי הוספת מפתח חדש לאובייקט I18N והעתקת כל המחרוזות. הקיפול ל-RTL נעשה אוטומטית עבור שפות RTL מוכרות."],
            ["h2","שמירת בחירת המשתמש"],
            ["p","בחירת השפה נשמרת ב-localStorage תחת המפתח aiop_lang, כך שלמשתמש לא תופיע השפה הלא-נכונה אחרי רענון."],
            ["h2","דברים שכדאי לדעת"],
            ["ul",["מספרים תמיד מוצגים LTR — גם בעברית","תאריכים מותאמים אוטומטית לכיוון השפה","אייקונים של חצים מתהפכים בכיוון הנכון","טבלאות עם נתונים מספריים נשארות יישור-לשמאל בכל שפה"]]
          ],
          en:[
            ["p","AIOP was built bilingual from the ground up. Every string lives in the I18N object under two keys: he and en. Switching happens via the top toggle, and document direction switches automatically between rtl and ltr."],
            ["h2","Adding a third language"],
            ["p","You can add languages (Arabic, Russian, French) by adding a new key to I18N and copying all strings. RTL folding is automatic for recognized RTL languages."],
            ["h2","Persisting user choice"],
            ["p","Language choice is stored in localStorage under the key aiop_lang, so the user doesn't see the wrong language after reload."],
            ["h2","Things to know"],
            ["ul",["Numbers always display LTR — even in Hebrew","Dates auto-adapt to language direction","Arrow icons flip in the correct direction","Tables with numeric data stay left-aligned in every language"]]
          ]
        }
      },
      { slug:"distribution", cat:"deploy",
        title:{ he:"הפצה: מייל, USB, אינטרנט", en:"Distribution: Email, USB, Web" },
        summary:{ he:"כל הדרכים להפיץ את קובץ AIOP למשתמשי הקצה.", en:"All the ways to distribute the AIOP file to end users." },
        body:{
          he:[
            ["h2","במייל"],
            ["p","הקובץ קטן (פחות מ-100KB ללא תמונות מוטמעות) ושולח את עצמו כצרופה רגילה. רוב מערכות המייל לא יחסמו אותו כי הוא HTML סטנדרטי."],
            ["h2","ב-USB"],
            ["p","פותחים מ-USB ישירות — לחיצה כפולה והוא נטען בדפדפן. שימושי לסביבות מסווגות / מנותקות."],
            ["h2","באתר פנימי / SharePoint"],
            ["p","מעלים את הקובץ לאתר ה-SharePoint או לאתר אינטרנט פנימי. המשתמשים פשוט פותחים את ה-URL."],
            ["h2","באמצעות LMS (SCORM)"],
            ["p","עבור ארגונים עם LMS (Moodle, 360Learning, וכד'), ניתן לעטוף את הקובץ באריזת SCORM שכוללת מעקב התקדמות והשלמת קורסים."]
          ],
          en:[
            ["h2","Via email"],
            ["p","The file is small (under 100KB without embedded images) and sends itself as a normal attachment. Most mail systems won't block it because it's standard HTML."],
            ["h2","Via USB"],
            ["p","Open directly from USB — double-click and it loads in the browser. Useful for classified / disconnected environments."],
            ["h2","Internal site / SharePoint"],
            ["p","Upload the file to your SharePoint or internal web. Users just open the URL."],
            ["h2","Via LMS (SCORM)"],
            ["p","For organizations with an LMS (Moodle, 360Learning, etc.), the file can be wrapped in a SCORM package including progress tracking and course completion."]
          ]
        }
      },
      { slug:"offline-mode", cat:"deploy",
        title:{ he:"עבודה אופליין", en:"Offline Mode" },
        summary:{ he:"איך AIOP פועלת בלי חיבור לאינטרנט, ומה הנקודות החשובות.", en:"How AIOP runs without internet, and what to watch out for." },
        body:{
          he:[
            ["p","אחרי טעינה ראשונה (שדורשת אינטרנט בשביל CDNs), הדפדפן שומר את הקבצים במטמון. מאז — AIOP יעבוד גם בלי רשת."],
            ["h2","Cache busting"],
            ["p","דפדפנים מודרניים מאחסנים את CDNs לזמן ארוך (שבועות). אם הלקוח עובד אופליין במשך חודשים, ייתכן שהמטמון יתפנה. במקרה זה — תחזירו אותו לרשת לרגע, והוא יטען שוב."],
            ["h2","פתרונות אופליין-מוחלט"],
            ["p","עבור סביבות מסווגות שאין להן לעולם אינטרנט, ניתן להטמיע את כל ה-CDNs ישירות בקובץ HTML. הגודל יגדל ל-~3MB, אבל הקובץ יהיה עצמאי לחלוטין."],
            ["h2","סנכרון נתונים"],
            ["p","אם נדרש להעלות נתונים (תוצאות בחנים, סטטיסטיקות שימוש) — אפשר לאחסן ב-localStorage באופן זמני ולסנכרן כשחוזרים לרשת."]
          ],
          en:[
            ["p","After first load (which needs internet for CDNs), the browser caches the files. From then on — AIOP works without network."],
            ["h2","Cache busting"],
            ["p","Modern browsers cache CDNs for a long time (weeks). If the customer works offline for months, the cache may evict. Then — reconnect briefly and it'll load again."],
            ["h2","Hard-offline builds"],
            ["p","For classified environments without internet ever, you can inline all CDNs into the HTML. Size grows to ~3MB but the file becomes fully self-contained."],
            ["h2","Data sync"],
            ["p","If data upload is needed (quiz results, usage stats) — store in localStorage temporarily and sync when back online."]
          ]
        }
      },
      { slug:"common-issues", cat:"faq",
        title:{ he:"בעיות נפוצות", en:"Common Issues" },
        summary:{ he:"FAQ של תקלות שכיחות בעת הפעלת AIOP.", en:"FAQ of common issues when running AIOP." },
        body:{
          he:[
            ["h2","הקובץ נפתח לבן/ריק"],
            ["p","בדרך כלל סימן ל-CDN שלא נטען. בדקו חיבור לאינטרנט בטעינה ראשונה. אם פיירוול חוסם — תוודאו ש-unpkg.com / cdnjs.cloudflare.com / jsdelivr.net לא חסומים."],

        const cats = {};

        return [
          { key:'all', label:t.docs_all, count:DOCS.length },
          { key:'gs', label:t.cat_gs, count:cats.gs||0 },
          { key:'arch', label:t.cat_arch, count:cats.arch||0 },

          { key:'i18n', label:t.cat_i18n, count:cats.i18n||0 },

          <div className="px-6 py-8 max-w-4xl mx-auto fade-in">

                if (type === 'h2') return <h2 key={i}>{content}</h2>;
                if (type === 'ul') return <ul key={i}>{content.map((li,j)=><li key={j}>{li}</li>)}</ul>;
                if (type === 'pre') return <pre key={i}><code>{content}</code></pre>;

            {related.length > 0 && (
              <div className="mt-10">
                <h3 className="text-lg font-bold mb-4" style={{color:'#fff'}}>{t.docs_related}</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {related.map(r=>(
                    <div key={r.slug} className="docs-card" onClick={()=>setActiveArticle(r.slug)}>
                      <h4 className="font-bold mb-1" style={{color:'#fff'}}>{r.title[lang]}</h4>
                      <p className="text-sm" style={{color:'var(--text-dim)'}}>{r.summary[lang]}</p>

      return (

            <aside className="md:col-span-1">
              <div className="docs-sidebar">
                <div className="docs-cat-title">{t.docs_categories}</div>
                {categories.map(c=>(
                  <div key={c.key} className={`docs-cat-item ${activeCat===c.key?'active':''}`} onClick={()=>setActiveCat(c.key)}>
                    <span>{c.label}</span>
                    <span style={{float: lang==='he'?'left':'right', color:'var(--text-dim)', fontSize:'0.8rem'}}>{c.count}</span>
                  </div>

              </div>
            </aside>
            <div className="md:col-span-3">
              <div className="mb-4 text-sm" style={{color:'var(--text-dim)'}}>{t.docs_results_count(filtered.length)}</div>
              {filtered.length === 0 ? (
                <div className="glass p-8 text-center" style={{color:'var(--text-dim)'}}>{t.docs_no_results}</div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {filtered.map(d=>(
                    <div key={d.slug} className="docs-card fade-in" onClick={()=>setActiveArticle(d.slug)}>
                      <div className="cat-tag">{catLabel(d.cat)}</div>
                      <h3 className="font-bold text-lg mb-1" style={{color:'#fff'}}>{d.title[lang]}</h3>
                      <p className="text-sm" style={{color:'var(--text-dim)'}}>{d.summary[lang]}</p>

                  ))}

      const channels = [
        { icon:'bug', n:t.s3_c1, d:t.s3_c1d },
        { icon:'book', n:t.s3_c2, d:t.s3_c2d },
        { icon:'graduation', n:t.s3_c3, d:t.s3_c3d },
        { icon:'tools', n:t.s3_c4, d:t.s3_c4d },
        { icon:'help', n:t.s3_c5, d:t.s3_c5d },
      ];
      return (
        <div className="slide-up">
          <h2 className="text-3xl md:text-4xl font-extrabold mb-3" style={{color:'#fff'}}>{t.s3_title}</h2>
          <p className="text-lg mb-8" style={{color:'var(--text-dim)'}}>{t.s3_lead}</p>
          <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">

              <div key={i} className={`channel-card ${active===i?'active':''}`} onClick={()=>setActive(i)} style={{animationDelay:`${i*0.06}s`}}>

                <p style={{color:'var(--text)'}}>{channels[active].d}</p>

          <div className="mt-8"><NavButtons lang={lang} onBack={onBack} onNext={onNext}/></div>

      );

    const Slide4 = ({ lang, onNext, onBack }) => {
      const t = I18N[lang];
      const hotspots = [
        { id:1, x:'8%',  y:'12%', t:t.s4_h1_t, d:t.s4_h1_d, tx:'40%',  ty:'40%' },
        { id:2, x:'50%', y:'12%', t:t.s4_h2_t, d:t.s4_h2_d, tx:'-50%', ty:'40%' },

      const allDone = done.length === hotspots.length;
      const click = (id) => { if (!done.includes(id)) setDone([...done, id]); setActive(id); };
      const aHs = active !== null ? hotspots.find(h=>h.id===active) : null;
      return (
        <div className="slide-up">
          <h2 className="text-3xl md:text-4xl font-extrabold mb-3" style={{color:'#fff'}}>{t.s4_title}</h2>

              <div className="mock-search hidden md:flex"><Icon name="search" size={16}/><span>{t.s4_search_ph}</span></div>

                <p className="text-sm" style={{color:'var(--text-dim)'}}>All In One Place</p>

                    <div className="flex justify-center mb-2" style={{color:'var(--accent)'}}><Icon name={['bug','book','graduation','tools','help'][i]} size={24}/></div>
                    <div className="text-xs" style={{color:'var(--text)'}}>{n}</div>

                {done.includes(h.id) ? <Icon name="check" size={14}/> : h.id}
              </button>
            ))}
            {aHs && (
              <div className="tooltip fade-in" style={{ left:aHs.x, top:aHs.y, transform:`translate(${aHs.tx}, ${aHs.ty})` }}>
                <div className="font-bold mb-1" style={{color:'var(--accent)'}}>{aHs.t}</div>
                <div>{aHs.d}</div>
              </div>
            )}
          </div>
          <div className="flex items-center gap-3 mb-4 text-sm" style={{color:'var(--text-dim)'}}>
            <span>{done.length} / {hotspots.length}</span>
            <div className="flex-1 progress-bar"><div className="progress-bar-fill" style={{width:`${(done.length/hotspots.length)*100}%`}}></div></div>
          </div>
          {allDone && (
            <div className="glass p-4 mb-4 zoom-in" style={{borderColor:'var(--success)', background:'rgba(16,185,129,0.08)'}}>
              <div className="flex items-center gap-3" style={{color:'#6ee7b7'}}>
                <Icon name="check" size={20}/><span>{t.s4_done}</span>
              </div>
            </div>
          )}
          <NavButtons lang={lang} onBack={onBack} onNext={onNext} disableNext={!allDone}/>
        </div>
      );
    };

    const Slide5 = ({ lang, onNext, onBack }) => {
      const t = I18N[lang];
      const steps = [
        { screen:'home',    target:'Troubleshooting' },
        { screen:'radar',   target:'MHR' },
        { screen:'station', target:'ATP Calibration' },
        { screen:'failure', target:'AGC Failure' },
      ];
      const screens = {
        home:    { title:'RADA AIOP', items:['Troubleshooting','Manuals','Training','Utilities','FAQs'] },
        radar:   { title:lang==='he'?'בחר מכ"ם':'Choose Radar', items:['MHR','ieMHR','aCHR','exMHR','nMHR'] },
        station: { title:lang==='he'?'בחר תחנה':'Choose MHR Station', items:['Inclinometer','OCXO','ESS','ATP Calibration','Bonding','Leakage'] },
        failure: { title:lang==='he'?'בחר תקלה':'Choose Failure', items:['AGC Failure','Velocity Measurement Failure','ALC Failure','Offset Failure','Tx Element Failure'] },
      };
      const [step, setStep] = useState(0);
      const done = step >= steps.length;
      const cur = done ? steps[steps.length-1] : steps[step];
      const screen = screens[cur.screen];
      const handleClick = (item) => { if (item === cur.target) setStep(step+1); };
      return (
        <div className="slide-up">
          <h2 className="text-3xl md:text-4xl font-extrabold mb-3" style={{color:'#fff'}}>{t.s5_title}</h2>
          <p className="text-lg mb-6" style={{color:'var(--text-dim)'}}>{t.s5_lead}</p>
          <div className="flex flex-wrap items-center gap-2 mb-4 text-sm">
            {steps.slice(0, step).map((s,i)=>(
              <React.Fragment key={i}>
                <span className="px-2 py-1 rounded" style={{background:'rgba(16,185,129,0.15)', color:'#6ee7b7'}}>{s.target}</span>
                <span style={{color:'var(--text-dim)'}}>›</span>
              </React.Fragment>
            ))}
            {!done && <span style={{color:'var(--text-dim)'}}>{t.s5_hint(step+1)}</span>}
          </div>
          {!done ? (
            <div className="mock-screen mb-6 fade-in" key={step}>
              <div className="mock-header">
                <Logo size="sm"/>
                <div className="mock-search hidden md:flex"><Icon name="search" size={16}/><span>{lang==='he'?'חיפוש...':'Search…'}</span></div>
                <div className="text-xs px-3 py-1 rounded-md" style={{background:'rgba(255,255,255,0.06)', color:'var(--text-dim)'}}>RADA</div>
              </div>
              <div className="p-8">
                <h4 className="text-xl font-bold text-center mb-6" style={{color:'#fff'}}>{screen.title}</h4>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                  {screen.items.map((item,i)=>{
                    const isTarget = item === cur.target;
                    return (
                      <button key={i} onClick={()=>handleClick(item)} className="p-4 rounded-lg text-center transition-all"
                        style={{
                          background: isTarget?'rgba(81,196,211,0.18)':'rgba(255,255,255,0.04)',
                          border: isTarget?'2px solid var(--accent)':'1px solid rgba(255,255,255,0.08)',
                          color:'var(--text)', cursor:'pointer', fontWeight:600,
                          animation: isTarget?'pulse 2s infinite':'none'
                        }}>{item}</button>
                    );
                  })}
                </div>
              </div>
            </div>
          ) : (
            <div className="glass p-8 mb-6 text-center zoom-in" style={{borderColor:'var(--success)', background:'rgba(16,185,129,0.08)'}}>
              <div className="flex justify-center mb-4" style={{color:'var(--success)'}}><Icon name="check" size={48}/></div>
              <h3 className="text-2xl font-bold mb-2" style={{color:'#6ee7b7'}}>{t.s5_done_t}</h3>
              <p style={{color:'var(--text-dim)'}}>{t.s5_done_d}</p>
              <div className="flex flex-wrap justify-center gap-2 mt-5 text-sm">
                {steps.map((s,i)=>(
                  <React.Fragment key={i}>
                    {i>0 && <span style={{color:'var(--text-dim)'}}>›</span>}
                    <span className="px-2 py-1 rounded" style={{background:'rgba(16,185,129,0.15)', color:'#6ee7b7'}}>{s.target}</span>
                  </React.Fragment>
                ))}
              </div>
            </div>
          )}
          <NavButtons lang={lang} onBack={onBack} onNext={onNext} disableNext={!done}/>
        </div>
      );

    const Slide6 = ({ lang, onNext, onBack }) => {
      const t = I18N[lang];
      const questions = [
        { q:t.s6_q1, o:t.s6_q1_o, c:t.s6_q1_c },
        { q:t.s6_q2, o:t.s6_q2_o, c:t.s6_q2_c },
        { q:t.s6_q3, o:t.s6_q3_o, c:t.s6_q3_c },
        { q:t.s6_q4, o:t.s6_q4_o, c:t.s6_q4_c },
      ];
      const [current, setCurrent] = useState(0);
      const [answers, setAnswers] = useState({});
      const [showResults, setShowResults] = useState(false);
      const score = Object.entries(answers).filter(([qi,ai])=>questions[qi].c===ai).length;
      const passed = score >= questions.length - 1;
      const answer = (ai) => { if (answers[current] !== undefined) return; setAnswers({...answers, [current]: ai}); };
      const nextQ = () => { if (current < questions.length - 1) setCurrent(current+1); else setShowResults(true); };
      const reset = () => { setCurrent(0); setAnswers({}); setShowResults(false); };
      if (showResults) {
        return (
          <div className="slide-up">
            <h2 className="text-3xl md:text-4xl font-extrabold mb-3" style={{color:'#fff'}}>{t.s6_title}</h2>
            <div className="glass p-8 text-center zoom-in">
              <div className="flex justify-center mb-4" style={{color: passed?'var(--success)':'var(--danger)'}}>
                <Icon name={passed?'check':'x'} size={64}/>
              </div>
              <div className="text-4xl font-extrabold mb-2" style={{color:'#fff'}}>{t.s6_score(score, questions.length)}</div>
              <p className="text-lg mb-6" style={{color: passed?'#6ee7b7':'#fca5a5'}}>
                {score === questions.length ? t.s6_perfect : (passed ? t.s6_good : t.s6_retry)}
              </p>
              <div className="flex gap-3 justify-center flex-wrap">
                <button className="btn btn-ghost" onClick={reset}>{t.s6_retry}</button>
                {passed && <button className="btn btn-primary" onClick={onNext}>{t.s6_next}</button>}
              </div>
            </div>
            {!passed && <div className="mt-6"><NavButtons lang={lang} onBack={onBack} onNext={onNext} disableNext={true}/></div>}
          </div>
        );
      }
      const q = questions[current];
      const userAns = answers[current];
      const answered = userAns !== undefined;
      return (
        <div className="slide-up">
          <h2 className="text-3xl md:text-4xl font-extrabold mb-3" style={{color:'#fff'}}>{t.s6_title}</h2>
          <p className="text-lg mb-6" style={{color:'var(--text-dim)'}}>{t.s6_lead}</p>
          <div className="flex gap-2 mb-6">
            {questions.map((_,i)=>(
              <div key={i} className="flex-1 progress-bar" style={{height:'6px'}}>
                <div className="progress-bar-fill" style={{width: i<current?'100%':(i===current?'50%':'0%')}}></div>
              </div>
            ))}
          </div>
          <div className="glass p-8 fade-in" key={current}>
            <div className="text-sm mb-3" style={{color:'var(--text-dim)'}}>{t.question} {current+1} / {questions.length}</div>
            <h3 className="text-xl md:text-2xl font-bold mb-6" style={{color:'#fff'}}>{q.q}</h3>
            <div className="space-y-3">
              {q.o.map((opt, i) => {
                let cls = 'quiz-option';
                if (answered) {
                  if (i === q.c) cls += ' correct';
                  else if (i === userAns) cls += ' wrong';
                }
                return <button key={i} className={cls} onClick={()=>answer(i)} disabled={answered} style={{width:'100%'}}>{opt}</button>;
              })}
            </div>
            {answered && (
              <div className="mt-5 flex items-center justify-between fade-in">
                <span style={{color: userAns===q.c?'#6ee7b7':'#fca5a5'}} className="font-bold">
                  {userAns===q.c ? t.s6_correct_l : t.s6_wrong_l}
                </span>
                <button className="btn btn-primary" onClick={nextQ}>
                  <span>{current < questions.length-1 ? t.next : t.finish}</span>
                  <Icon name="arrowRight" size={16} className={lang==='he'?'rotate-180':''}/>
                </button>
              </div>
            )}
          </div>
          <div className="mt-6"><NavButtons lang={lang} onBack={onBack} onNext={onNext} disableNext={true}/></div>
        </div>
      );
    };

    const Slide7 = ({ lang, onBack, onRestart }) => {
      const t = I18N[lang];
      const items = [t.s7_l1, t.s7_l2, t.s7_l3, t.s7_l4];
      return (
        <div className="slide-up">
          <div className="text-center mb-8 zoom-in">
            <div className="inline-block mb-4" style={{color:'var(--accent)'}}><Icon name="sparkles" size={64}/></div>
            <h2 className="text-4xl md:text-5xl font-extrabold mb-3" style={{color:'#fff'}}>{t.s7_title}</h2>
            <p className="text-lg" style={{color:'var(--text-dim)'}}>{t.s7_lead}</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="glass p-6">
              <h3 className="font-bold text-lg mb-4" style={{color:'#fff'}}>{t.s7_what}</h3>
              {items.map((item,i)=>(
                <div key={i} className="checklist-item">
                  <div className="check-icon"><Icon name="check" size={14}/></div>
                  <span>{item}</span>
                </div>
              ))}
            </div>
            <div className="glass p-6 glow-border">
              <div className="text-sm font-bold mb-2" style={{color:'var(--accent)'}}>{t.s7_up}</div>
              <h3 className="font-bold text-lg mb-3" style={{color:'#fff'}}>{t.s7_next_ch}</h3>
              <p style={{color:'var(--text-dim)'}}>{t.s7_next_d}</p>
              <button className="btn btn-primary mt-5" disabled style={{opacity:0.5}}><span>{t.s7_soon}</span></button>
            </div>
          </div>
          <div className="text-center mt-10">
            <p className="text-lg mb-4" style={{color:'#fff'}}>{t.s7_thanks}</p>
            <div className="flex gap-3 justify-center flex-wrap">
              <button className="btn btn-ghost" onClick={onBack}>
                <Icon name="arrowRight" size={16} className={lang==='he'?'':'rotate-180'}/>
                <span>{t.back}</span>
              </button>
              <button className="btn btn-primary" onClick={onRestart}>
                <Icon name="play" size={16}/>
                <span>{t.restart}</span>
              </button>
            </div>
          </div>
        </div>
      );
    };

    const TOTAL_SLIDES = 7;
    const Lomda = ({ lang }) => {
      const [current, setCurrent] = useState(0);
      const next = () => setCurrent(c => Math.min(c+1, TOTAL_SLIDES-1));
      const back = () => setCurrent(c => Math.max(c-1, 0));
      const restart = () => setCurrent(0);
      const jump = (i) => setCurrent(i);
      const slides = [
        <Slide1 lang={lang} onNext={next}/>,
        <Slide2 lang={lang} onNext={next} onBack={back}/>,
        <Slide3 lang={lang} onNext={next} onBack={back}/>,
        <Slide4 lang={lang} onNext={next} onBack={back}/>,
        <Slide5 lang={lang} onNext={next} onBack={back}/>,
        <Slide6 lang={lang} onNext={next} onBack={back}/>,
        <Slide7 lang={lang} onBack={back} onRestart={restart}/>,
      ];
      return (
        <div className="px-6 py-8 max-w-6xl mx-auto w-full">
          {slides[current]}
        </div>
      );
    };

    /* ================================ APP ================================ */
    const STORAGE_KEY = 'aiop_portal_v2';
    const App = () => {
      const [lang, setLang] = useState(() => localStorage.getItem(STORAGE_KEY+'_lang') || 'he');
      const [route, setRoute] = useState(() => localStorage.getItem(STORAGE_KEY+'_route') || 'portal');
      const [lomdaSlide, setLomdaSlide] = useState(() => parseInt(localStorage.getItem(STORAGE_KEY+'_slide') || '0', 10));

      useEffect(()=>{
        document.documentElement.dir = lang==='he' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        localStorage.setItem(STORAGE_KEY+'_lang', lang);
      }, [lang]);
      useEffect(()=>{ localStorage.setItem(STORAGE_KEY+'_route', route); }, [route]);
      useEffect(()=>{ localStorage.setItem(STORAGE_KEY+'_slide', String(lomdaSlide)); }, [lomdaSlide]);

      const t = I18N[lang];
      const titles = {
        portal: t.appName,
        marketing: t.portal_marketing_t,
        lomda: t.lomdaTitle,
        docs: t.docs_title,
      };

      // Build slide-progress only when in lomda
      const slideProgressFor = route === 'lomda' ? {
        current: lomdaSlide,
        total: TOTAL_SLIDES,
        onJump: setLomdaSlide,
      } : null;

      // Wrap Lomda with controlled slide state so progress bar reflects it
      const LomdaControlled = () => {
        const next = () => setLomdaSlide(c => Math.min(c+1, TOTAL_SLIDES-1));
        const back = () => setLomdaSlide(c => Math.max(c-1, 0));
        const restart = () => setLomdaSlide(0);
        const slides = [
          <Slide1 lang={lang} onNext={next}/>,
          <Slide2 lang={lang} onNext={next} onBack={back}/>,
          <Slide3 lang={lang} onNext={next} onBack={back}/>,
          <Slide4 lang={lang} onNext={next} onBack={back}/>,
          <Slide5 lang={lang} onNext={next} onBack={back}/>,
          <Slide6 lang={lang} onNext={next} onBack={back}/>,
          <Slide7 lang={lang} onBack={back} onRestart={restart}/>,
        ];
        return <div className="px-6 py-8 max-w-6xl mx-auto w-full">{slides[lomdaSlide]}</div>;
      };

      const content = {
        portal:    <Portal lang={lang} onNavigate={setRoute}/>,
        marketing: <Marketing lang={lang} onGoLomda={()=>setRoute('lomda')} onGoDocs={()=>setRoute('docs')}/>,
        lomda:     <LomdaControlled/>,
        docs:      <Docs lang={lang}/>,
      };

      return (
        <Shell route={route} lang={lang} setLang={setLang}
               onBack={()=>setRoute('portal')}
               title={titles[route]}
               slideProgress={slideProgressFor}>
          {content[route]}
        </Shell>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
