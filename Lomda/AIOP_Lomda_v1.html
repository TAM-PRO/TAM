  <script>
    // CDN loader with fallback chain. Tries unpkg → jsdelivr → cdnjs.
    function loadScript(urls, name, cb) {
      var i = 0;
      function tryNext() {
        if (i >= urls.length) { cb(new Error(name + ' failed all CDNs: ' + urls.join(', '))); return; }
        var s = document.createElement('script');
        s.src = urls[i++];
        s.crossOrigin = 'anonymous';
        s.onload = function(){ cb(null); };
        s.onerror = function(){ tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    }
    function showError(msg) {
      var el = document.getElementById('root') || document.body;
      var box = document.createElement('div');
      box.style.cssText = 'background:#111;color:#fca5a5;padding:20px;margin:20px;border:1px solid #ef4444;border-radius:8px;font-family:monospace;font-size:13px;white-space:pre-wrap;direction:ltr;text-align:left;';
      box.textContent = msg;
      el.parentNode.insertBefore(box, el);
    }
    window.addEventListener('error', function(e) {
      var msg = (e.error && e.error.stack) ? e.error.stack : (e.message + ' at ' + (e.filename||'') + ':' + (e.lineno||''));
      showError('JS ERROR:\n' + msg);
    });
    // Load React, then ReactDOM, then Babel — each with fallbacks.
    loadScript([
      'https://unpkg.com/react@18/umd/react.production.min.js',
      'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'
    ], 'React', function(err){
      if (err) { showError(err.message); return; }
      loadScript([
        'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
        'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js',
        'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js'
      ], 'ReactDOM', function(err){
        if (err) { showError(err.message); return; }
        loadScript([
          'https://unpkg.com/@babel/standalone/babel.min.js',
          'https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js',
          'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js'
        ], 'Babel', function(err){
          if (err) { showError(err.message); return; }
          // All libs loaded — now compile and run the JSX bundle.
          var src = document.getElementById('app-source').textContent;
          try {
            var out = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
            (0, eval)(out);
          } catch (e) {
            showError('Babel/eval error:\n' + (e.stack || e.message));
          }
        });
      });
    });

  <style>
    :root {
      --bg: #0b1622;
      --bg-2: #112c3b;
      --surface: rgba(255,255,255,0.04);
      --surface-2: rgba(255,255,255,0.07);
      --border: rgba(81,196,211,0.2);
      --border-strong: rgba(81,196,211,0.5);
      --accent: #51c4d3;
      --accent-2: #2563eb;
      --text: #e2e8f0;
      --text-dim: #8a9cae;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, var(--bg-2) 0%, var(--bg) 70%);
      color: var(--text);
      font-family: 'Heebo', 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    html[dir="ltr"] body { font-family: 'Inter', 'Heebo', system-ui, sans-serif; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(81,196,211,0.7); } 50% { box-shadow: 0 0 0 12px rgba(81,196,211,0); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    .slide-up { animation: slideUp 0.5s ease-out; }
    .zoom-in { animation: zoomIn 0.35s ease-out; }

    /* Components */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
    }
    .glow-border { box-shadow: 0 0 24px rgba(81,196,211,0.15); border: 1px solid var(--border-strong); }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; justify-content: center;
      padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; transition: all 0.2s; border: none; user-select: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; box-shadow: 0 4px 20px rgba(81,196,211,0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(81,196,211,0.45); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-ghost {
      background: rgba(255,255,255,0.05); color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }

    .channel-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 28px 20px; cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
    }
    .channel-card:hover {
      background: rgba(30,41,59,0.6);
      border-color: var(--border-strong);
      box-shadow: 0 0 20px rgba(81,196,211,0.2);
      transform: translateY(-4px);
    }
    .channel-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 24px rgba(81,196,211,0.4);
    }

    .hotspot {
      position: absolute; width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--accent); color: #0b1622;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px;
      cursor: pointer;
      animation: pulse 2s infinite;
      border: 2px solid #fff;
      z-index: 5;
    }
    .hotspot.done { background: var(--success); color: #fff; animation: none; }

    .progress-bar {
      height: 4px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.4s ease;
    }

    .chapter-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.15); transition: all 0.2s;
      cursor: pointer;
    }
    .chapter-dot.active { background: var(--accent); transform: scale(1.4); }
    .chapter-dot.done { background: var(--success); }

    /* Mock AIOP screen */
    .mock-screen {
      background: #0d1f2d; border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden; position: relative;
    }
    .mock-header {
      background: rgba(255,255,255,0.04); padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .mock-search {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 999px; padding: 8px 16px; color: var(--text-dim);
      font-size: 13px; flex: 1; max-width: 400px;
      display: flex; align-items: center; gap: 8px;
    }

    .quiz-option {
      background: rgba(255,255,255,0.04); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 14px 18px; cursor: pointer;
      transition: all 0.2s; text-align: start;
      color: var(--text); font-weight: 500;
    }
    .quiz-option:hover { border-color: var(--border-strong); background: rgba(81,196,211,0.08); }
    .quiz-option.correct { border-color: var(--success); background: rgba(16,185,129,0.15); color: #6ee7b7; }
    .quiz-option.wrong { border-color: var(--danger); background: rgba(239,68,68,0.12); color: #fca5a5; }
    .quiz-option:disabled { cursor: default; }

    .tooltip {
      position: absolute; background: #0d1f2d; color: var(--text);
      border: 1px solid var(--border-strong); border-radius: 10px;
      padding: 10px 14px; font-size: 13px; max-width: 240px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 10;
      pointer-events: none;
    }

    .checklist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; color: var(--text);
    }
    .check-icon {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(16,185,129,0.15); border: 2px solid var(--success);
      display: flex; align-items: center; justify-content: center;
      color: var(--success); flex-shrink: 0; font-weight: 800;
    }

    /* Logo */
    .aiop-logo {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 800; font-size: 1.4rem; color: #fff;
      letter-spacing: 0.5px;
    }
    .aiop-logo-mark {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 10px;
      display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(81,196,211,0.4);
      position: relative;
    }
    .aiop-logo-mark::before {
      content: ''; position: absolute; inset: 4px;
      border: 2px solid rgba(255,255,255,0.85); border-radius: 6px;
    }
    .aiop-logo-mark::after {
      content: ''; position: absolute; width: 8px; height: 8px;
      background: #fff; border-radius: 50%;
    }

    @media (max-width: 768px) {
      .channel-card { padding: 20px 14px; }
    }
  </style>

              <div className="flex gap-3 justify-center flex-wrap">
                <button className="btn btn-ghost" onClick={reset}>{t.s6_retry}</button>
                {passed && <button className="btn btn-primary" onClick={onNext}>{t.s6_next}</button>}
              </div>
            </div>
            {!passed && <div className="mt-6"><NavButtons lang={lang} onBack={onBack} onNext={onNext} disableNext={true}/></div>}
          </div>
        );
      }

      const q = questions[current];
      const userAns = answers[current];
      const answered = userAns !== undefined;

      return (
        <div className="slide-up">
          <h2 className="text-3xl md:text-4xl font-extrabold mb-3" style={{color:'#fff'}}>{t.s6_title}</h2>
          <p className="text-lg mb-6" style={{color:'var(--text-dim)'}}>{t.s6_lead}</p>

          <div className="flex gap-2 mb-6">
            {questions.map((_,i)=>(
              <div key={i} className="flex-1 progress-bar" style={{height:'6px'}}>
                <div className="progress-bar-fill" style={{width: i<current?'100%':(i===current?'50%':'0%')}}></div>
              </div>
            ))}
          </div>

          <div className="glass p-8 fade-in" key={current}>
            <div className="text-sm mb-3" style={{color:'var(--text-dim)'}}>{lang==='he'?'שאלה':'Question'} {current+1} / {questions.length}</div>
            <h3 className="text-xl md:text-2xl font-bold mb-6" style={{color:'#fff'}}>{q.q}</h3>
            <div className="space-y-3">
              {q.opts.map((opt, i) => {
                let cls = 'quiz-option';
                if (answered) {
                  if (i === q.correct) cls += ' correct';
                  else if (i === userAns) cls += ' wrong';
                }
                return (
                  <button key={i} className={cls} onClick={()=>answer(i)} disabled={answered} style={{width:'100%'}}>
                    {opt}
                  </button>
                );
              })}
            </div>
            {answered && (
              <div className="mt-5 flex items-center justify-between fade-in">
                <span style={{color: userAns===q.correct?'#6ee7b7':'#fca5a5'}} className="font-bold">
                  {userAns===q.correct ? t.s6_correct_label : t.s6_wrong_label}
                </span>
                <button className="btn btn-primary" onClick={nextQ}>
                  <span>{current < questions.length-1 ? t.next : t.finish}</span>
                  <Icon name="arrowRight" size={16} className={lang==='he'?'rotate-180':''}/>
                </button>
              </div>
            )}
          </div>

          <div className="mt-6"><NavButtons lang={lang} onBack={onBack} onNext={onNext} disableNext={true}/></div>
        </div>
      );
    };

    /* ============================ SLIDE 7: SUMMARY ============================ */
    const Slide7 = ({ lang, onBack, onRestart }) => {
      const t = I18N[lang];
      const items = [t.s7_l1, t.s7_l2, t.s7_l3, t.s7_l4];
      return (
        <div className="slide-up">
          <div className="text-center mb-8 zoom-in">
            <div className="inline-block mb-4" style={{color:'var(--accent)'}}><Icon name="sparkles" size={64}/></div>
            <h2 className="text-4xl md:text-5xl font-extrabold mb-3" style={{color:'#fff'}}>{t.s7_title}</h2>
            <p className="text-lg" style={{color:'var(--text-dim)'}}>{t.s7_lead}</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="glass p-6">
              <h3 className="font-bold text-lg mb-4" style={{color:'#fff'}}>{lang==='he'?'מה למדת':'What you learned'}</h3>
              {items.map((item,i)=>(
                <div key={i} className="checklist-item">
                  <div className="check-icon"><Icon name="check" size={14}/></div>
                  <span>{item}</span>
                </div>
              ))}
            </div>

            <div className="glass p-6 glow-border">
              <div className="text-sm font-bold mb-2" style={{color:'var(--accent)'}}>{lang==='he'?'הבא בתור':'Up Next'}</div>
              <h3 className="font-bold text-lg mb-3" style={{color:'#fff'}}>{t.s7_next_chapter}</h3>
              <p style={{color:'var(--text-dim)'}}>{t.s7_next_desc}</p>
              <button className="btn btn-primary mt-5" disabled style={{opacity:0.5}}>
                <span>{lang==='he'?'בקרוב':'Coming soon'}</span>
              </button>
            </div>
          </div>

          <div className="text-center mt-10">
            <p className="text-lg mb-4" style={{color:'#fff'}}>{t.s7_thanks}</p>
            <div className="flex gap-3 justify-center flex-wrap">
              <button className="btn btn-ghost" onClick={onBack}>
                <Icon name="arrowRight" size={16} className={lang==='he'?'':'rotate-180'}/>
                <span>{t.back}</span>
              </button>
              <button className="btn btn-primary" onClick={onRestart}>
                <Icon name="play" size={16}/>
                <span>{t.restart}</span>
              </button>
            </div>
          </div>
        </div>
      );
    };

    /* ============================ NAV BUTTONS ============================ */
    const NavButtons = ({ lang, onBack, onNext, disableNext = false }) => {
      const t = I18N[lang];
      return (
        <div className="flex justify-between items-center pt-4 border-t" style={{borderColor:'rgba(255,255,255,0.05)'}}>
          <button className="btn btn-ghost" onClick={onBack}>
            <Icon name="arrowRight" size={16} className={lang==='he'?'':'rotate-180'}/>
            <span>{t.back}</span>
          </button>
          <button className="btn btn-primary" onClick={onNext} disabled={disableNext}>
            <span>{t.next}</span>
            <Icon name="arrowLeft" size={16} className={lang==='he'?'':'rotate-180'}/>
          </button>
        </div>
      );
    };

    /* ============================ APP ============================ */
    const STORAGE_KEY = 'aiop_lomda_progress_v1';

    const App = () => {
      const [lang, setLang] = useState(() => localStorage.getItem(STORAGE_KEY+'_lang') || 'he');
      const [current, setCurrent] = useState(() => {
        const saved = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
        return isNaN(saved) ? 0 : Math.min(saved, TOTAL_SLIDES-1);
      });

      useEffect(()=>{
        document.documentElement.dir = lang==='he' ? 'rtl' : 'ltr';
        document.documentElement.lang = lang;
        localStorage.setItem(STORAGE_KEY+'_lang', lang);
      }, [lang]);

      useEffect(()=>{
        localStorage.setItem(STORAGE_KEY, String(current));
      }, [current]);

      const next = () => setCurrent(c => Math.min(c+1, TOTAL_SLIDES-1));
      const back = () => setCurrent(c => Math.max(c-1, 0));
      const restart = () => setCurrent(0);
      const jump = (i) => setCurrent(i);

      const slides = [
        <Slide1 lang={lang} onNext={next}/>,
        <Slide2 lang={lang} onNext={next} onBack={back}/>,
        <Slide3 lang={lang} onNext={next} onBack={back}/>,
        <Slide4 lang={lang} onNext={next} onBack={back}/>,
        <Slide5 lang={lang} onNext={next} onBack={back}/>,
        <Slide6 lang={lang} onNext={next} onBack={back}/>,
        <Slide7 lang={lang} onBack={back} onRestart={restart}/>,
      ];

      return (
        <Shell current={current} total={TOTAL_SLIDES} lang={lang} setLang={setLang} onJump={jump}>
          {slides[current]}
        </Shell>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
