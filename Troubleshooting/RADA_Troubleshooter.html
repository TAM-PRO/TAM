        <div style={{ width:'112px', height:'112px', position:'relative', flexShrink:0 }}>
          <div style={{ position:'absolute', top:'12px', left:'12px', right:'12px', bottom:'12px', transform:'rotate(45deg)', borderRadius:'3px', background:qBg, border:(isCurrent?'3px':'1.5px')+' solid '+qColor, boxShadow:qSh }}>

          </div>
        </div>
      </div>
    );
  }

  if (step.type === 'menu') {
    var mColor = isCurrent ? '#3b82f6' : '#94a3b8';
    var mBg    = isCurrent ? '#eff6ff' : '#f8fafc';
    var mSh    = isCurrent
      ? '0 0 0 4px rgba(59,130,246,0.3), 0 0 16px rgba(59,130,246,0.4)'
      : 'none';
    return (
      <div className={outerCls} style={Object.assign({ opacity:dimOpacity, display:'flex', flexDirection:'column', alignItems:'center' }, clickStyle)} onClick={handleClick}>
        <div style={{ minWidth:'120px', minHeight:'40px', padding:'8px 12px', background:mBg, border:(isCurrent?'3px':'1.5px')+' solid '+mColor, borderRadius:'12px', boxShadow:mSh, textAlign:'center', fontSize:'10px', lineHeight:'1.4', fontWeight:isCurrent?'800':'400', color:'#1e293b', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <span style={{ overflowWrap:'break-word' }}>{step.text}</span>
        </div>
      </div>
    );
  }

  if (step.type === 'landing') {
    var lColor = isCurrent ? '#8b5cf6' : '#94a3b8';
    var lBg    = isCurrent ? '#f3e8ff' : '#f8fafc';
    var lSh    = isCurrent
      ? '0 0 0 4px rgba(139,92,246,0.3), 0 0 16px rgba(139,92,246,0.4)'
      : 'none';

      <div className={outerCls} style={Object.assign({ opacity:dimOpacity, display:'flex', flexDirection:'column', alignItems:'center' }, clickStyle)} onClick={handleClick}>
        <div style={{ minWidth:'120px', minHeight:'40px', padding:'8px 12px', background:lBg, border:(isCurrent?'3px':'1.5px')+' solid '+lColor, borderRadius:'16px', boxShadow:lSh, textAlign:'center', fontSize:'10px', lineHeight:'1.4', fontWeight:isCurrent?'800':'400', color:'#1e293b', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <span style={{ overflowWrap:'break-word' }}>🏠 {step.text}</span>
        </div>
      </div>
    );
  }

  /* action (default) */
  var aColor = isCurrent ? '#3b82f6' : '#cbd5e1';
  var aBg    = isCurrent ? '#eff6ff' : '#fff';
  var aSh    = isCurrent
    ? '0 0 0 4px rgba(59,130,246,0.3), 0 0 16px rgba(59,130,246,0.4)'
    : 'none';
  return (
    <div className={outerCls} style={Object.assign({ opacity:dimOpacity, display:'flex', flexDirection:'column', alignItems:'center' }, clickStyle)} onClick={handleClick}>

        <span style={{ overflowWrap:'break-word' }}>{step.text}</span>
      </div>
    </div>
  );
}

function ContextualFlow(props) {
  var currentStepId = props.currentStepId || null;
  var history       = props.history || [];
  var onNavigate    = props.onNavigate || null;
  var ctx = useContext(LangContext);
  var t   = ctx.t;
  var currentNodeRef = useRef(null);
  useEffect(function() {
    if (currentNodeRef.current) currentNodeRef.current.scrollIntoView({ behavior:'smooth', block:'center' });
  }, [currentStepId]);

  if (!currentStepId) return <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100%', color:'#94a3b8', fontSize:'13px', padding:'20px' }}>{t('selectStep')}</div>;
  var step = nodes[currentStepId] || null;
  if (!step) return <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100%', color:'#94a3b8', fontSize:'13px', padding:'20px' }}>{t('stepNotFound')}: {currentStepId}</div>;

  var parentId   = history.length >= 2 ? history[history.length - 2] : null;
  var parentStep = (parentId && nodes[parentId]) ? nodes[parentId] : null;
  var parentLabel = '';
  var parentColor = 'slate';
  if (parentStep) {
    if (parentStep.type === 'question') {
      if (parentStep.yesTarget === currentStepId) { parentLabel = parentStep.yesLabel || t('yes'); parentColor = 'green'; }
      else if (parentStep.noTarget === currentStepId) { parentLabel = parentStep.noLabel || t('no'); parentColor = 'red'; }
    } else if (parentStep.type === 'menu' || parentStep.type === 'landing') {
      var pOpts = parentStep.options || [];
      for (var pi = 0; pi < pOpts.length; pi++) {
        if (pOpts[pi] && pOpts[pi].targetId === currentStepId) { parentLabel = pOpts[pi].label || ''; parentColor = 'blue'; break; }
      }
    } else { parentLabel = parentStep.nextLabel || ''; }
  }

  var children = [];
  if (step.type === 'question') {
    if (step.yesTarget && nodes[step.yesTarget]) children.push({ id:step.yesTarget, label:step.yesLabel||t('yes'), color:'green' });
    if (step.noTarget && nodes[step.noTarget]) children.push({ id:step.noTarget, label:step.noLabel||t('no'), color:'red' });
  } else if (step.type === 'menu' || step.type === 'landing') {
    var mOpts = step.options || [];
    for (var mi = 0; mi < mOpts.length; mi++) {
      if (mOpts[mi] && mOpts[mi].targetId && nodes[mOpts[mi].targetId]) children.push({ id:mOpts[mi].targetId, label:mOpts[mi].label||'', color:'blue' });
    }
  } else {
    if (step.nextTarget && nodes[step.nextTarget]) children.push({ id:step.nextTarget, label:step.nextLabel||'', color:'slate' });
  }

  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', padding:'20px 8px', minHeight:'100%' }}>
      {parentStep && (
        <Fragment>
          <FlowNode stepId={parentId} role="parent" onNavigate={onNavigate} />
          <FlowConnector label={parentLabel} color={parentColor} />
        </Fragment>
      )}
      <div ref={currentNodeRef} style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
        <FlowNode stepId={currentStepId} role="current" onNavigate={onNavigate} />
      </div>
      {children.length === 1 && (
        <Fragment>
          <FlowConnector label={children[0].label} color={children[0].color} />
          <FlowNode stepId={children[0].id} role="child" onNavigate={onNavigate} />
        </Fragment>
      )}
      {children.length > 1 && (function(){
        var COL_W  = 150;
        var totalW = children.length * COL_W;
        var midX   = totalW / 2;
        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
            <div style={{ width:'1px', height:'12px', background:'#94a3b8' }} />
            <svg width={totalW} height={14} style={{ overflow:'visible', flexShrink:0 }}>
              <line x1={midX-(COL_W*(children.length-1))/2} y1={7} x2={midX+(COL_W*(children.length-1))/2} y2={7} stroke='#94a3b8' strokeWidth={1}/>
              {children.map(function(ch,idx){ var x=COL_W*idx+COL_W/2; return <line key={idx} x1={x} y1={7} x2={x} y2={14} stroke='#94a3b8' strokeWidth={1}/>; })}
            </svg>
            <div style={{ display:'flex', flexDirection:'row', gap:'0', alignItems:'flex-start' }}>
              {children.map(function(ch,idx){
                return (
                  <div key={ch.id||idx} style={{ width:COL_W+'px', display:'flex', flexDirection:'column', alignItems:'center' }}>
                    <FlowConnector label={ch.label} color={ch.color} />
                    <FlowNode stepId={ch.id} role="child" onNavigate={onNavigate} />
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function Chatbot(props) {
  var isOpen     = props.isOpen;
  var onClose    = props.onClose;
  var onNavigate = props.onNavigate || function(){};
  var ctx   = useContext(LangContext);
  var t     = ctx.t;
  var isRTL = ctx.isRTL;

  var STOP_WORDS = ['i','have','a','the','my','is','am','not','im','with','to','for','of',
                    'an','how','why','do','does','what','where','when','can','it','in','on',
                    'at','and','or','he','ה','ב','ל','מ','ו','ש','של','אני','איך','למה',
                    'מה','כן','לא','זה','יש','אין','עם','על','כי'];

  function tokenize(str) {
    var words = str.toLowerCase().match(/[a-z0-9א-ת]+/g) || [];
    return words.filter(function(w){ return w.length > 1 && STOP_WORDS.indexOf(w) === -1; });
  }

  function nlpSearch(query) {
    var tokens = tokenize(query);
    if (!tokens.length) return null;
    var allN = Object.values(nodes);
    var scored = allN.map(function(nd) {
      var title   = (nd.title || nd.name || '').toLowerCase();
      var content = [(nd.text||''), (nd.yesLabel||''), (nd.noLabel||''),
                     (nd.options||[]).map(function(o){ return o.label||''; }).join(' ')
                    ].join(' ').toLowerCase();
      var score = tokens.reduce(function(s, tok) {
        return s + (title.includes(tok) ? 2 : 0) + (content.includes(tok) ? 1 : 0);
      }, 0);
      return { nd:nd, score:score };
    }).filter(function(x){ return x.score > 0; })
      .sort(function(a,b){ return b.score - a.score; });
    // deduplicate by label so identical display names never appear twice
    var seen = {};
    var deduped = [];
    for (var di = 0; di < scored.length && deduped.length < 3; di++) {
      var nd  = scored[di].nd;
      var lbl = nd.title || nd.name || nd.id;
      if (!seen[lbl]) {
        seen[lbl] = true;
        // build a short description: step type + brief text preview
        var typeTag = nd.type === 'question' ? (isRTL?'שאלה':'Question')
                    : nd.type === 'action'   ? (isRTL?'פעולה':'Action')
                    : nd.type === 'end'      ? (isRTL?'סיום':'End')
                    : nd.type === 'landing'  ? (isRTL?'דף נחיתה':'Landing')
                    : (isRTL?'תפריט':'Menu');
        var preview = (nd.text || '').trim();
        if (preview.length > 60) preview = preview.substring(0, 60) + '...';
        deduped.push({ id: nd.id, label: lbl, typeTag: typeTag, desc: preview });
      }
    }
    return deduped;
  }

  var greeting = isRTL
    ? 'שלום! תאר את הבעיה שאתה נתקל בה ואנסה להפנות אותך לשלב המתאים.'
    : 'Hello! Describe the issue you are facing and I will try to direct you to the right step.';

  var FILLERS_EN = [
    'Let me check the manual for you...',
    'Give me a moment to look into that...',
    'Hmm, let me see what we can find...',
    'One sec, searching the knowledge base...',
    'On it — scanning through the steps...'
  ];
  var FILLERS_HE = [
    'תן לי לבדוק את המדריך עבורך...',
    'רגע, אני מחפש...',
    'המ, בוא נראה מה אפשר למצוא...',
    'שנייה, סורק את מאגר הידע...',
    'בודק את השלבים הרלוונטיים...'
  ];

  var msgsState   = useState([{ sender:'bot', text: greeting }]);
  var messages    = msgsState[0];
  var setMessages = msgsState[1];
  var inputState  = useState('');
  var inputVal    = inputState[0];
  var setInputVal = inputState[1];
  var typingState = useState(false);
  var isTyping    = typingState[0];
  var setIsTyping = typingState[1];
  var endRef = useRef(null);

  useEffect(function() {
    if (endRef.current) endRef.current.scrollIntoView({ behavior:'smooth' });
  }, [messages, isTyping]);

  if (!isOpen) return null;

  function sendMessage() {
    var text = inputVal.trim();
    if (!text || isTyping) return;
    var userMsg = { sender:'user', text:text };
    setMessages(function(prev){ return prev.concat([userMsg]); });
    setInputVal('');
    setIsTyping(true);

    // Phase 1 — filler after 800ms
    setTimeout(function() {
      var fillers = isRTL ? FILLERS_HE : FILLERS_EN;
      var filler  = fillers[Math.floor(Math.random() * fillers.length)];
      setMessages(function(prev){ return prev.concat([{ sender:'bot', text: filler }]); });

      // Phase 2 — real results after another 1000ms
      setTimeout(function() {
        var tokens  = tokenize(text);
        var results = nlpSearch(text);
        var botMsg;
        if (results && results.length > 0) {
          var keyword = tokens.length > 0 ? tokens[0].toUpperCase() : '';
          var intro = isRTL
            ? (keyword ? 'אני רואה שאתה מתמודד עם "'+keyword+'". בוא נפתור את זה יחד. אני חושב שהשלב הזה הוא בדיוק מה שאתה צריך:' : 'מצאתי משהו שעשוי לעזור. האם זה אחד מאלה?')
            : (keyword ? 'I see you are dealing with "'+keyword+'". Let me help you figure this out. I think this step might be exactly what you need:' : 'I found something that might help. Is it one of these?');
          botMsg = { sender:'bot', text: intro, options: results };
        } else if (tokens.length === 0) {
          botMsg = {
            sender: 'bot',
            text: isRTL
              ? 'לא זיהיתי מילות מפתח. נסה להקליד מונחים טכניים ספציפיים יותר.'
              : 'No keywords detected. Try typing more specific technical terms.'
          };
        } else {
          botMsg = {
            sender: 'bot',
            text: (isRTL ? 'חיפשתי: ' : 'I searched for: ') +
                  '"' + tokens.join('", "') + '"' +
                  (isRTL ? ' — אך לא מצאתי התאמה. נסה מילות מפתח אחרות.' : ' — but found no match. Try different keywords.')
          };
        }
        setMessages(function(prev){ return prev.concat([botMsg]); });
        setIsTyping(false);
      }, 1000);
    }, 800);
  }

  var chatSide = isRTL ? { left:'18px' } : { right:'18px' };
  var sm = window.__DESIGN_THEME__ === 'stitch_modern';
  var panelBg    = sm ? '#0d1f2d' : '#fff';
  var headerBg   = sm ? '#0b1622' : '#1e293b';
  var botBubble  = sm ? 'rgba(81,196,211,0.1)' : '#f1f5f9';
  var botTxt     = sm ? '#e2e8f0' : '#1e293b';
  var inputBg    = sm ? 'rgba(255,255,255,0.06)' : '#fff';
  var inputClr   = sm ? '#e2e8f0' : '#1e293b';
  var borderClr  = sm ? 'rgba(81,196,211,0.2)' : '#e2e8f0';

  return (
    <div style={Object.assign({ position:'fixed', bottom:'78px', zIndex:1000, width:'320px', height:'440px', background:panelBg, borderRadius:'18px', boxShadow:'0 8px 40px rgba(0,0,0,0.22)', border:'1px solid '+borderClr, display:'flex', flexDirection:'column', overflow:'hidden' }, chatSide)}>
      {/* Header */}
      <div style={{ padding:'11px 16px', background:headerBg, color:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:'7px' }}>
          <div style={{ width:'8px', height:'8px', borderRadius:'50%', background:'#4ade80', flexShrink:0 }} />
          <span style={{ fontWeight:'700', fontSize:'13px' }}>{t('aiAssistant')}</span>
        </div>
        <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', color:'rgba(255,255,255,0.7)', padding:'2px', display:'flex', alignItems:'center', lineHeight:1 }}>
          <XIcon size={15} />
        </button>
      </div>

      {/* Messages */}
      <div style={{ flex:1, overflowY:'auto', padding:'12px 10px', display:'flex', flexDirection:'column', gap:'10px' }}>
        {messages.map(function(m, i) {
          var isUser = m.sender === 'user';
          return (
            <div key={i} style={{ display:'flex', flexDirection:'column', alignItems: isUser ? 'flex-end' : 'flex-start' }}>
              <div style={{
                background: isUser ? '#2563eb' : botBubble,
                color: isUser ? '#fff' : botTxt,
                borderRadius: isUser ? '14px 14px 3px 14px' : '14px 14px 14px 3px',
                padding:'9px 13px', fontSize:'12.5px', maxWidth:'88%', lineHeight:'1.55',
                boxShadow: isUser ? '0 2px 8px rgba(37,99,235,0.25)' : 'none'
              }}>{m.text}</div>
              {/* Step suggestion buttons */}
              {m.options && m.options.length > 0 && (
                <div style={{ display:'flex', flexDirection:'column', gap:'6px', marginTop:'7px', width:'100%' }}>
                  {m.options.map(function(opt, oi) {
                    return (
                      <button key={oi}
                        onClick={function(){
                          onNavigate(opt.id);
                          var feedbackQ = isRTL
                            ? 'ניווטתי אותך לשלב זה. האם זה פתר את הבעיה?'
                            : 'I have opened that step for you. Did this solve your problem?';
                          var yesLabel = isRTL ? '✓ כן, תודה!' : '✓ Yes, thanks!';
                          var noLabel  = isRTL ? '✗ לא, צריך עזרה נוספת' : '✗ No, still broken';
                          setMessages(function(prev){
                            return prev.concat([{ sender:'bot', text: feedbackQ, feedbackOptions:[yesLabel, noLabel] }]);
                          });
                        }}
                        style={{ background: sm?'rgba(81,196,211,0.08)':'#f8faff', border:'1.5px solid '+(sm?'rgba(81,196,211,0.35)':'#bfdbfe'), borderRadius:'10px', padding:'8px 12px', fontSize:'12px', cursor:'pointer', textAlign: isRTL?'right':'left', lineHeight:'1.4', transition:'background 0.15s', width:'100%' }}
                        onMouseEnter={function(e){ e.currentTarget.style.background = sm?'rgba(81,196,211,0.18)':'#eff6ff'; }}
                        onMouseLeave={function(e){ e.currentTarget.style.background = sm?'rgba(81,196,211,0.08)':'#f8faff'; }}
                      >
                        <div style={{ display:'flex', alignItems:'center', gap:'6px', marginBottom: opt.desc ? '3px' : '0' }}>
                          <span style={{ fontWeight:'700', color: sm?'#e2e8f0':'#1d4ed8', fontSize:'12px' }}>↗ {opt.label}</span>
                        </div>
                        {opt.desc && (
                          <div style={{ fontSize:'11px', color: sm?'#94a3b8':'#64748b', lineHeight:'1.4', paddingRight: isRTL?'0':'0', paddingLeft:'0' }}>{opt.desc}</div>
                        )}
                      </button>
                    );
                  })}
                </div>
              )}
              {/* Feedback buttons (Yes / No) */}
              {m.feedbackOptions && m.feedbackOptions.length > 0 && (
                <div style={{ display:'flex', flexDirection:'row', gap:'6px', marginTop:'7px', flexWrap:'wrap' }}>
                  {m.feedbackOptions.map(function(label, fi) {
                    var isYes = fi === 0;
                    return (
                      <button key={fi}
                        onClick={function(){
                          var userReply = { sender:'user', text: label };
                          var botReply  = isYes
                            ? { sender:'bot', text: isRTL ? 'מצוין! שמח שעזרתי. אל תהסס לשאול אם תצטרך עוד עזרה.' : 'Awesome! Glad I could help. Let me know if you need anything else.' }
                            : { sender:'bot', text: isRTL ? 'מצטער לשמוע. נסה לתאר את הבעיה במילים אחרות או עיין בתרשים הזרימה.' : 'Sorry to hear that. Try describing the issue with different keywords or check the flowchart.' };
                          setMessages(function(prev){ return prev.concat([userReply, botReply]); });
                        }}
                        style={{ background: isYes ? (sm?'rgba(16,185,129,0.15)':'#dcfce7') : (sm?'rgba(239,68,68,0.12)':'#fee2e2'), border:'1.5px solid '+(isYes?(sm?'#10b981':'#86efac'):(sm?'#ef4444':'#fca5a5')), borderRadius:'8px', padding:'5px 11px', fontSize:'11.5px', fontWeight:'700', color: isYes?(sm?'#6ee7b7':'#166534'):(sm?'#fca5a5':'#991b1b'), cursor:'pointer', transition:'opacity 0.15s' }}
                        onMouseEnter={function(e){ e.currentTarget.style.opacity='0.75'; }}
                        onMouseLeave={function(e){ e.currentTarget.style.opacity='1'; }}
                      >
                        {label}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
        {isTyping && (
          <div style={{ display:'flex', alignItems:'flex-start', gap:'4px' }}>
            <div style={{ background:botBubble, borderRadius:'14px', padding:'9px 14px', fontSize:'14px', color:'#94a3b8', letterSpacing:'3px' }}>•••</div>
          </div>
        )}
        <div ref={endRef} />
      </div>

      {/* Input */}
      <div style={{ padding:'8px 10px', borderTop:'1px solid '+borderClr, display:'flex', gap:'6px', flexShrink:0, background: sm?'rgba(255,255,255,0.03)':panelBg }}>
        <input
          type="text"
          value={inputVal}
          onChange={function(e){ setInputVal(e.target.value); }}
          onKeyDown={function(e){ if(e.key==='Enter') sendMessage(); }}
          placeholder={t('typeMessage')}
          dir={isRTL?'rtl':'ltr'}
          style={{ flex:1, padding:'8px 11px', border:'1.5px solid '+borderClr, borderRadius:'10px', fontSize:'12.5px', outline:'none', minWidth:0, color:inputClr, background:inputBg }}
        />
        <button onClick={sendMessage} disabled={isTyping}
          style={{ background:'#2563eb', color:'#fff', border:'none', borderRadius:'10px', padding:'8px 12px', cursor:'pointer', opacity:isTyping?0.5:1, flexShrink:0, display:'flex', alignItems:'center', transition:'opacity 0.15s' }}>
          <SendIcon size={13} />
        </button>
      </div>
    </div>
  );
}

function findStartNode() {
  var allIds = Object.keys(nodes);
  if (allIds.length === 0) return null;
  var targeted = {};
  Object.values(nodes).forEach(function(nd) {
    if (nd.yesTarget)  targeted[nd.yesTarget]  = true;
    if (nd.noTarget)   targeted[nd.noTarget]   = true;
    if (nd.nextTarget) targeted[nd.nextTarget] = true;
    (nd.options || []).forEach(function(o) { if (o && o.targetId) targeted[o.targetId] = true; });
  });
  var roots = allIds.filter(function(id) { return !targeted[id]; });
  // prefer landing type among roots
  var landingRoot = roots.find(function(id) { return nodes[id] && nodes[id].type === 'landing'; });
  if (landingRoot) return landingRoot;
  if (roots.length > 0) return roots[0];
  return allIds[0];
}

function App() {
  var initDir  = document.documentElement.dir || 'rtl';
  var initLang = initDir === 'ltr' ? 'en' : 'he';
  var langState       = useState(initLang);
  var lang            = langState[0];
  var setLang         = langState[1];
  var stepState       = useState(function(){ return findStartNode(); });
  var currentStep     = stepState[0];
  var setCurrentStep  = stepState[1];
  var histState       = useState([]);
  var history         = histState[0];
  var setHistory      = histState[1];
  var chatState       = useState(false);
  var chatOpen        = chatState[0];
  var setChatOpen     = chatState[1];
  var procSearchState = useState('');
  var procSearch      = procSearchState[0];
  var setProcSearch   = procSearchState[1];
  var splitWState     = useState(function(){ return parseInt(localStorage.getItem('__sw__')||'280'); });
  var splitWidth      = splitWState[0];
  var setSplitWidth   = splitWState[1];
  var chartVisState   = useState(true);
  var chartVisible    = chartVisState[0];
  var setChartVisible = chartVisState[1];
  var dragRef   = useRef(false);
  var startXRef = useRef(0);
  var startWRef = useRef(280);

  useEffect(function() {
    function onMove(e) {
      if (!dragRef.current) return;
      var dx = e.clientX - startXRef.current;
      var nw = Math.min(480, Math.max(160, startWRef.current + dx));
      setSplitWidth(nw);
      localStorage.setItem('__sw__', nw);
    }
    function onUp() { dragRef.current = false; document.body.style.cursor=''; document.body.style.userSelect=''; }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    return function() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
  }, []);

  var isRTL = lang === 'he';
  var t = function(key) { var d = DICT[lang] || DICT.he; return d[key] || key; };

  useEffect(function() {
    var dir = lang === 'he' ? 'rtl' : 'ltr';
    document.documentElement.dir  = dir;
    document.documentElement.lang = lang;
    localStorage.setItem('__viewer_dir', dir);
  }, [lang]);

  function goTo(stepId) {
    if (!stepId || !nodes[stepId]) return;
    setHistory(function(prev){ return prev.concat([stepId]); });
    setCurrentStep(stepId);
  }
  var startNode = findStartNode();
  function goBack() {
    if (history.length <= 1) { setCurrentStep(startNode); setHistory([]); }
    else { var next = history.slice(0,history.length-1); setCurrentStep(next[next.length-1]); setHistory(next); }
  }
  function goHome() { setCurrentStep(startNode); setHistory([]); setChatOpen(false); }

  var ctxValue = { lang:lang, isRTL:isRTL, t:t, setLang:setLang };
  var currentStepData = currentStep ? (nodes[currentStep] || null) : (startNode ? (nodes[startNode] || null) : null);
  var stepText = currentStepData ? (currentStepData.text || '') : '';

  function renderStepContent() {
    if (!currentStepData) return null;
    var step = currentStepData;
    var sm = window.__DESIGN_THEME__ === 'stitch_modern';

    // ── Universal media helper ────────────────────────────────────────────────
    function renderStepMedia(stp) {
      var mType = stp.mediaType || (stp.media && stp.media.type);
      var mUrl  = stp.mediaUrl  || (stp.media && stp.media.url);
      if (!mUrl || !mType || mType === 'none') return null;
      var wrap = {
        borderRadius:'8px', overflow:'hidden', marginBottom:'4px',
        border:'1px solid ' + (sm ? 'rgba(81,196,211,0.2)' : '#e2e8f0'),
        background: sm ? 'rgba(0,0,0,0.2)' : '#f8fafc'
      };
      if (mType === 'image') return (
        <div style={wrap}>
          <img src={mUrl} alt="" style={{ width:'100%', maxHeight:'360px', objectFit:'contain', display:'block' }} />
        </div>
      );
      if (mType === 'video') return (
        <div style={wrap}>
          <video src={mUrl} controls style={{ width:'100%', maxHeight:'360px', display:'block', background:'#000' }}></video>
        </div>
      );
      return (
        <div style={wrap}>
          {React.createElement('model-viewer', { src:mUrl, 'auto-rotate':'', 'camera-controls':'', style:{ width:'100%', height:'300px', display:'block', background:sm?'rgba(0,0,0,0.3)':'#f1f5f9' } })}
        </div>
      );
    }
    // ─────────────────────────────────────────────────────────────────────────

    if (step.type === 'end') {
      var ok = step.endType !== 'failure';
      return (
        <div style={{ padding:'16px', display:'flex', flexDirection:'column', gap:'14px', alignItems:'center' }}>
          <div className={sm ? (ok ? 'sm-end-ok' : 'sm-end-fail') : ''} style={sm ? {} : { background:ok?'#f0fdf4':'#fff1f2', border:'2px solid '+(ok?'#10b981':'#ef4444'), borderRadius:'12px', padding:'20px', textAlign:'center', width:'100%' }}>
            <div style={{ marginBottom:'8px' }}>{ok ? <CheckCircleIcon size={32} style={{ color:sm?'#6ee7b7':'#10b981' }}/> : <AlertCircleIcon size={32} style={{ color:sm?'#fca5a5':'#ef4444' }}/>}</div>
            <div style={{ fontWeight:'700', fontSize:'15px', lineHeight:'1.5' }}>{step.text}</div>
          </div>
          {renderStepMedia(step)}
          <button onClick={goHome} className={sm?'sm-btn-next':''} style={sm?{}:{ background:'#2563eb', color:'#fff', border:'none', borderRadius:'8px', padding:'9px 20px', cursor:'pointer', fontSize:'14px', fontWeight:'700' }}>{t('backToMenu')}</button>
        </div>
      );
    }

    if (step.type === 'question') {
      return (
        <div style={{ padding:'16px', display:'flex', flexDirection:'column', gap:'12px' }}>
          <div className={sm?'sm-step-q':''} style={sm?{}:{ background:'#fffbeb', border:'2px solid #f59e0b', borderRadius:'10px', padding:'14px', textAlign:'center', fontSize:'14px', fontWeight:'600', color:'#78350f', lineHeight:'1.5' }}>{step.text}</div>
          {renderStepMedia(step)}
          <div style={{ display:'flex', gap:'8px' }}>
            {step.yesTarget && <button onClick={function(){ goTo(step.yesTarget); }} className={sm?'sm-btn-yes':''} style={sm?{}:{ flex:1, background:'#ecfdf5', color:'#065f46', border:'2px solid #10b981', borderRadius:'8px', padding:'10px 6px', cursor:'pointer', fontWeight:'700', fontSize:'14px' }}>{step.yesLabel||t('yes')}</button>}
            {step.noTarget  && <button onClick={function(){ goTo(step.noTarget);  }} className={sm?'sm-btn-no' :''} style={sm?{}:{ flex:1, background:'#fff1f2', color:'#7f1d1d', border:'2px solid #ef4444', borderRadius:'8px', padding:'10px 6px', cursor:'pointer', fontWeight:'700', fontSize:'14px' }}>{step.noLabel ||t('no') }</button>}
          </div>
        </div>
      );
    }

    if (step.type === 'menu' || step.type === 'landing') {
      var opts = step.options || [];
      return (
        <div style={{ padding:'16px', display:'flex', flexDirection:'column', gap:'10px' }}>
          <div className={sm?'sm-step-q':''} style={sm?{}:{ background:step.type==='landing'?'#f3e8ff':'#f8fafc', border:'1.5px solid '+(step.type==='landing'?'#8b5cf6':'#94a3b8'), borderRadius:'10px', padding:'12px', textAlign:'center', fontSize:'14px', color:'#1e293b', lineHeight:'1.5' }}>{step.text}</div>
          {renderStepMedia(step)}
          <div style={{ display:'flex', flexDirection:'column', gap:'6px' }}>
            {opts.map(function(opt,i) {
              if (!opt || !opt.targetId) return null;
              return (
                <button key={i} onClick={function(){ goTo(opt.targetId); }} className={sm?'sm-btn-option':''} style={sm?{textAlign:isRTL?'right':'left'}:{ background:'#fff', border:'1.5px solid #e2e8f0', borderRadius:'8px', padding:'10px 14px', cursor:'pointer', fontSize:'13px', color:'#1e293b', fontWeight:'500', display:'flex', alignItems:'center', justifyContent:'space-between', textAlign:isRTL?'right':'left' }}
                  onMouseEnter={sm?null:function(e){ e.currentTarget.style.borderColor='#93c5fd'; }}
                  onMouseLeave={sm?null:function(e){ e.currentTarget.style.borderColor='#e2e8f0'; }}
                >
                  <span>{opt.label}</span>
                  {isRTL ? <ChevronLeftIcon size={13} style={{ color:sm?'#51c4d3':'#94a3b8', flexShrink:0 }}/> : <ChevronRightIcon size={13} style={{ color:sm?'#51c4d3':'#94a3b8', flexShrink:0 }}/>}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    return (
      <div style={{ padding:'16px', display:'flex', flexDirection:'column', gap:'12px' }}>
        <div className={sm?'sm-step':''} style={sm?{}:{ background:'#fff', border:'2px solid #3b82f6', borderRadius:'10px', padding:'14px', fontSize:'14px', color:'#1e293b', lineHeight:'1.6' }}>{step.text}</div>
        {renderStepMedia(step)}
        {step.nextTarget && (
          <button onClick={function(){ nodes[step.nextTarget] ? goTo(step.nextTarget) : goHome(); }} className={sm?'sm-btn-next':''} style={sm?{}:{ background:'#2563eb', color:'#fff', border:'none', borderRadius:'8px', padding:'10px', cursor:'pointer', fontWeight:'700', fontSize:'14px' }}>
            {(step.nextLabel && !SKIP[step.nextLabel]) ? step.nextLabel : t('continue')}
          </button>
        )}
      </div>
    );
  }

  var isLandingStep = currentStepData && currentStepData.type === 'landing';
  if (!currentStep || isLandingStep) {
    var procOptions      = isLandingStep ? (currentStepData.options||[]).filter(function(o){ return o&&o.targetId&&nodes[o.targetId]; }) : null;
    var lc               = isLandingStep ? (currentStepData.landingConfig || {}) : {};
    var landingMainTitle = isLandingStep ? (currentStepData.mainTitle || currentStepData.title || '') : '';
    var landingSubtitle  = isLandingStep ? (currentStepData.subtitle  || '') : '';
    var landingHeroImage = isLandingStep ? (lc.heroImage  || currentStepData.heroImage  || '') : '';
    var landingLogoUrl   = isLandingStep ? (lc.logoUrl    || '') : '';
    var landingImgPos    = isLandingStep ? (lc.imagePosition || 'top') : 'top';
    var landingLogoH     = isLandingStep ? (lc.logoHeight  || 56)  : 56;
    var landingHeroH     = isLandingStep ? (lc.heroHeight  || 160) : 160;
    var landingIconSz    = isLandingStep ? (lc.iconSize    || 48)  : 48;
    var landingTitleClr  = isLandingStep ? (lc.titleColor || '') : '';
    var landingTextClr   = isLandingStep ? (lc.textColor  || '') : '';
    var landingCtaText   = isLandingStep ? (currentStepData.ctaText   || '') : '';
    var landingCtaTarget = isLandingStep ? (currentStepData.ctaTarget || '') : '';
    var landingStepText  = isLandingStep ? (currentStepData.text      || '') : '';
    return (
      <LangContext.Provider value={ctxValue}>
        <div style={{ minHeight:'100vh', position:'relative', display:'flex', flexDirection:'column', background:window.__DESIGN_THEME__==='stitch_modern'?'#0b1622':'#f1f5f9' }}>
          {isLandingStep && (
            <div style={{ background:'#1e293b', color:'#fff', padding:'9px 14px', display:'flex', alignItems:'center', gap:'8px', flexShrink:0, boxShadow:'0 2px 8px rgba(0,0,0,0.15)' }}>
              <button onClick={goBack} style={{ background:'rgba(255,255,255,0.1)', border:'none', borderRadius:'6px', padding:'5px 9px', cursor:'pointer', color:'#fff', display:'flex', alignItems:'center', gap:'4px', fontSize:'12px' }}>
                {isRTL ? <ChevronRightIcon size={13}/> : <ChevronLeftIcon size={13}/>}{t('back')}
              </button>
              <button onClick={goHome} title={t('home')} style={{ background:'rgba(255,255,255,0.1)', border:'none', borderRadius:'6px', padding:'5px 8px', cursor:'pointer', color:'#fff', display:'flex', alignItems:'center' }}><HomeIcon size={14}/></button>
              <div style={{ flex:1, fontWeight:'700', fontSize:'14px', textAlign:'center' }}>{currentStepData.title||currentStepData.text}</div>
              {window.__HEADER_LOGO__ && (
                <img src={window.__HEADER_LOGO__} alt="logo" style={{ height:'34px', maxWidth:'120px', objectFit:'contain', flexShrink:0, display:'block' }} />
              )}
            </div>
          )}
          <div style={{ flex:1, overflowY:'auto' }}>
            <LandingPage key={currentStep||'__home__'} onSelect={goTo} processOptions={procOptions} mainTitle={landingMainTitle} subtitle={landingSubtitle} heroImage={landingHeroImage} logoUrl={landingLogoUrl} imagePosition={landingImgPos} titleColor={landingTitleClr} textColor={landingTextClr} logoHeight={landingLogoH} heroHeight={landingHeroH} iconSize={landingIconSz} ctaText={landingCtaText} ctaTarget={landingCtaTarget} stepText={landingStepText} history={history} onGoTo={goTo} />
          </div>
          <button onClick={function(){ setChatOpen(function(o){ return !o; }); }}
            style={Object.assign({ position:'fixed', bottom:'30px', zIndex:999, background:'#2563eb', color:'#fff', border:'none', borderRadius:'50%', width:'48px', height:'48px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 16px rgba(37,99,235,0.4)' }, isRTL?{left:'18px'}:{right:'18px'})}>
            <MessageCircleIcon size={20}/>
          </button>
          <Chatbot isOpen={chatOpen} onClose={function(){ setChatOpen(false); }} onNavigate={function(id){ goTo(id); }}/>
          {window.__DISCLAIMER_TEXT__ && (
            <div style={{ position:'fixed', bottom:0, left:0, right:0, zIndex:998, textAlign:'center', padding:'3px 12px', fontSize:(window.__DISCLAIMER_SIZE__||10)+'px', color: window.__DISCLAIMER_COLOR__ || 'rgba(100,116,139,0.6)', background: window.__DESIGN_THEME__==='stitch_modern' ? 'rgba(11,22,34,0.85)' : 'rgba(248,250,252,0.9)', backdropFilter:'blur(4px)', letterSpacing:'0.04em', pointerEvents:'none', userSelect:'none' }}>
              {window.__DISCLAIMER_TEXT__}
            </div>
          )}
        </div>
      </LangContext.Provider>
    );
  }

  var mainDir   = isRTL ? 'row-reverse' : 'row';
  var stepTitle = currentStepData ? (currentStepData.title||currentStepData.name||'') : '';
  var fabSide   = isRTL ? { left:'18px' } : { right:'18px' };

  return (
    <LangContext.Provider value={ctxValue}>
      <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', background:window.__DESIGN_THEME__==='stitch_modern'?'#0b1622':'#f1f5f9' }}>
        <div style={{ background:window.__DESIGN_THEME__==='stitch_modern'?'#0d1f2d':'#1e293b', borderBottom:window.__DESIGN_THEME__==='stitch_modern'?'1px solid rgba(81,196,211,0.15)':'none', color:'#fff', padding:'9px 14px', display:'flex', alignItems:'center', gap:'8px', flexShrink:0, boxShadow:'0 2px 8px rgba(0,0,0,0.15)' }}>
          <button onClick={goHome} title={t('home')} style={{ background:'rgba(255,255,255,0.1)', border:'none', borderRadius:'6px', padding:'5px 8px', cursor:'pointer', color:'#fff', display:'flex', alignItems:'center' }}><HomeIcon size={14}/></button>
          {history.length > 0 && (
            <button onClick={goBack} style={{ background:'rgba(255,255,255,0.1)', border:'none', borderRadius:'6px', padding:'5px 9px', cursor:'pointer', color:'#fff', display:'flex', alignItems:'center', gap:'4px', fontSize:'12px' }}>
              {isRTL ? <ChevronRightIcon size={13}/> : <ChevronLeftIcon size={13}/>}{t('back')}
            </button>
          )}
          <div style={{ flex:1, fontWeight:'700', fontSize:'14px', textAlign:'center', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{stepTitle}</div>
          {window.__HEADER_LOGO__ && (
            <img src={window.__HEADER_LOGO__} alt="logo" style={{ height:'34px', maxWidth:'120px', objectFit:'contain', flexShrink:0, display:'block' }} />
          )}
        </div>

        <div className="body-flex" style={{ flex:1, display:'flex', flexDirection:mainDir, overflow:'hidden', minHeight:0 }}>
          <div className="process-panel" style={{ width:splitWidth+'px', minWidth:'160px', maxWidth:'480px', flexShrink:0, borderLeft:isRTL?'none':'1px solid #e2e8f0', borderRight:isRTL?'1px solid #e2e8f0':'none', overflowY:'auto', background:'#fff' }}>
            {(function() {
              var pq = procSearch.trim().toLowerCase();
              var pResults = pq ? Object.values(nodes).filter(function(nd){ var hay=((nd.title||'')+' '+(nd.text||'')+' '+(nd.name||'')).toLowerCase(); return hay.indexOf(pq)!==-1; }).slice(0,8) : [];
              var sPad  = isRTL ? { paddingRight:'30px', paddingLeft:'8px' }  : { paddingLeft:'30px', paddingRight:'8px' };
              var sIcon = isRTL ? { right:'8px', left:'auto' } : { left:'8px', right:'auto' };
              return (
                <div style={{ padding:'8px 10px', borderBottom:'1px solid #f1f5f9', position:'relative' }}>
                  <div style={{ position:'relative' }}>
                    <div style={{ position:'absolute', top:'50%', transform:'translateY(-50%)', color:'#94a3b8', pointerEvents:'none', right:sIcon.right, left:sIcon.left }}><SearchIcon size={12}/></div>
                    <input type="text" value={procSearch} onChange={function(e){ setProcSearch(e.target.value); }} placeholder={t('search')}
                      style={Object.assign({ width:'100%', boxSizing:'border-box', paddingTop:'6px', paddingBottom:'6px', border:'1.5px solid #e2e8f0', borderRadius:'8px', fontSize:'12px', outline:'none', background:'#f8fafc', color:'#1e293b' }, sPad)}/>
                  </div>
                  {pResults.length > 0 && (
                    <div style={{ position:'absolute', top:'100%', left:'10px', right:'10px', zIndex:200, background:'#fff', border:'1px solid #e2e8f0', borderRadius:'8px', boxShadow:'0 4px 12px rgba(0,0,0,0.12)', maxHeight:'200px', overflowY:'auto' }}>
                      {pResults.map(function(nd) {
                        return (
                          <div key={nd.id} onClick={function(){ goTo(nd.id); setProcSearch(''); }}
                            style={{ padding:'7px 11px', cursor:'pointer', borderBottom:'1px solid #f1f5f9' }}
                            onMouseEnter={function(e){ e.currentTarget.style.background='#f1f5f9'; }}
                            onMouseLeave={function(e){ e.currentTarget.style.background=''; }}>
                            <div style={{ fontWeight:'600', fontSize:'12px', color:'#1e293b' }}>{nd.name||nd.id}</div>
                            {nd.text && <div style={{ color:'#64748b', fontSize:'11px', marginTop:'1px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{nd.text}</div>}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })()}
            <div style={{ padding:'10px 14px 6px', borderBottom:'1px solid #f1f5f9' }}>
              <div style={{ fontSize:'10px', color:'#94a3b8', textTransform:'uppercase', letterSpacing:'0.06em' }}>{t('currentStep')}</div>
              <div style={{ fontWeight:'700', fontSize:'13px', color:'#1e293b', marginTop:'2px' }}>{currentStepData&&(currentStepData.name||currentStepData.id)}</div>
            </div>
            {renderStepContent()}
          </div>

          <div className="drag-handle" onMouseDown={function(e){ dragRef.current=true; startXRef.current=e.clientX; startWRef.current=splitWidth; document.body.style.cursor='col-resize'; document.body.style.userSelect='none'; e.preventDefault(); }}/>

          {chartVisible && (
            <div className="chart-panel" style={{ flex:1, overflowY:'auto', overflowX:'auto', background:'#f8fafc', display:'flex', flexDirection:'column' }}>
              <div style={{ fontSize:'10px', color:'#94a3b8', textTransform:'uppercase', letterSpacing:'0.06em', padding:'5px 8px 3px', textAlign:'center', flexShrink:0, display:'flex', justifyContent:'center', alignItems:'center', gap:'6px' }}>
                <span>{t('flowchart')}</span>
                <button className="chart-collapse-btn" onClick={function(){ setChartVisible(false); }}>✕</button>
              </div>
              <div className="chart-inner" style={{ flex:1, display:'flex', justifyContent:'center', alignItems:'flex-start' }}>
                <ContextualFlow currentStepId={currentStep} history={history} onNavigate={goTo}/>
              </div>
            </div>
          )}
          {!chartVisible && (
            <button className="chart-collapse-btn" style={{ writingMode:'vertical-rl', padding:'12px 4px', margin:'4px 2px', borderRadius:'6px', fontSize:'11px' }} onClick={function(){ setChartVisible(true); }}>
              {isRTL?'◀':'▶'} {t('flowchart')}
            </button>
          )}
        </div>

        <button onClick={function(){ setChatOpen(function(o){ return !o; }); }}
          style={Object.assign({ position:'fixed', bottom:'30px', zIndex:999, background:'#2563eb', color:'#fff', border:'none', borderRadius:'50%', width:'48px', height:'48px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 4px 16px rgba(37,99,235,0.4)' }, fabSide)}>
          <MessageCircleIcon size={20}/>
        </button>
        <Chatbot isOpen={chatOpen} onClose={function(){ setChatOpen(false); }} stepText={stepText} onNavigate={function(id){ goTo(id); }}/>
        {window.__DISCLAIMER_TEXT__ && (
          <div style={{ position:'fixed', bottom:0, left:0, right:0, zIndex:998, textAlign:'center', padding:'3px 12px', fontSize:(window.__DISCLAIMER_SIZE__||10)+'px', color: window.__DISCLAIMER_COLOR__ || 'rgba(100,116,139,0.6)', background: window.__DESIGN_THEME__==='stitch_modern' ? 'rgba(11,22,34,0.85)' : 'rgba(248,250,252,0.9)', backdropFilter:'blur(4px)', letterSpacing:'0.04em', pointerEvents:'none', userSelect:'none' }}>
            {window.__DISCLAIMER_TEXT__}
          </div>
        )}
      </div>
    </LangContext.Provider>
  );
}

var rootEl = document.getElementById('root');
if (rootEl) {
  ReactDOM.createRoot(rootEl).render(<ErrorBoundary><App /></ErrorBoundary>);
}

    </script>
</body>
</html>
