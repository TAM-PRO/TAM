  [/^פרק (\d+)\/(\d+)$/, "Chapter $1/$2"],
  [/^(\d+) פרקים · (\d+) הושלמו$/, "$1 chapters · $2 completed"],
  [/^(\d+) פרקים$/, "$1 chapters"],

function trStr(s){
  if (S.lang === SRCLANG) return s;
  var t = String(s);
  var mem = (P.tr && P.tr[S.lang]) || {};
  if (mem[t] != null) return mem[t];
  if (VT[t] != null) return VT[t];
  for (var i=0;i<VTP.length;i++){ if (VTP[i][0].test(t.trim())) return t.trim().replace(VTP[i][0], VTP[i][1]); }
  return s;
}
function localizeDom(root){
  if (S.lang === SRCLANG) return;
  var walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  var nodes = [], n;
  while ((n = walk.nextNode())) nodes.push(n);
  nodes.forEach(function(node){
    var raw = node.nodeValue; if (!raw) return;
    var trimmed = raw.trim(); if (!trimmed) return;
    var out = trStr(trimmed);
    if (out !== trimmed) node.nodeValue = raw.replace(trimmed, out);
  });
  Array.prototype.forEach.call(root.querySelectorAll('input[placeholder]'), function(inp){
    var out = trStr(inp.getAttribute('placeholder'));
    if (out) inp.setAttribute('placeholder', out);
  });
}

  else if (s.type === 'cards') {
    inner = '<h2 style="color:#fff;font-size:1.9rem;margin-bottom:8px">' + esc(s.title) + '</h2>';
    if (s.lead) inner += '<p class="dim" style="margin-bottom:8px">' + esc(s.lead) + '</p>';
    inner += '<div class="chgrid">';
    (s.items||[]).forEach(function(c,i){
      inner += '<div class="chcard ' + (S.hsActive===i?'on':'') + '" onclick="S.hsActive=' + i + ';render()">' + esc(c.t) + '</div>';
    });
    inner += '</div><div class="glass" style="padding:18px;min-height:76px">';
    if (S.hsActive === null || !(s.items||[])[S.hsActive]) inner += '<span class="dim" style="font-style:italic">' + esc(s.pickHint || '...') + '</span>';
    else inner += '<div style="color:var(--accent);font-weight:700;margin-bottom:5px">' + esc(s.items[S.hsActive].t) + '</div><div>' + esc(s.items[S.hsActive].d) + '</div>';
    inner += '</div>';
  }
  else if (s.type === 'hotspots') {
    var spots = s.spots || [];
    gated = S.hsDone.length < spots.length;
    inner = '<h2 style="color:#fff;font-size:1.9rem;margin-bottom:8px">' + esc(s.title) + '</h2>';
    if (s.lead) inner += '<p class="dim" style="margin-bottom:16px">' + esc(s.lead) + '</p>';
    inner += '<div class="hswrap" ' + (s.imageUrl ? 'style="background-image:url(' + esc(s.imageUrl) + ')"' : '') + '>';
    if (!s.imageUrl) inner += '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center" class="dim">' + esc(s.placeholder || '') + '</div>';
    spots.forEach(function(sp,i){
      var done = S.hsDone.indexOf(i) >= 0;
      inner += '<button class="hspot ' + (done?'done':'') + '" style="left:' + esc(sp.x) + ';top:' + esc(sp.y) + '" onclick="hsClick(' + i + ')">' + (done ? icon('check',13) : (i+1)) + '</button>';
      if (S.hsActive === i) {
        inner += '<div class="htip" style="left:' + esc(sp.x) + ';top:calc(' + esc(sp.y) + ' + 38px)"><div style="color:var(--accent);font-weight:700;margin-bottom:4px">' + esc(sp.t) + '</div>' + esc(sp.d) + '</div>';
      }
    });
    inner += '</div><div class="row" style="display:flex;gap:11px;align-items:center;margin-top:13px"><span class="dim" style="font-size:.83rem">' + S.hsDone.length + ' / ' + spots.length + '</span><div class="prog"><div class="progf" style="width:' + (spots.length?Math.round(S.hsDone.length/spots.length*100):0) + '%"></div></div></div>';
    if (!gated && s.doneMsg) inner += '<div class="glass" style="padding:13px 17px;margin-top:13px;border-color:var(--ok);color:#6ee7b7;display:flex;gap:9px;align-items:center">' + icon('check',17) + ' ' + esc(s.doneMsg) + '</div>';
  }
  else if (s.type === 'sim') {
    var steps = s.steps || [];
    var done = S.simStep >= steps.length;
    gated = !done;
    inner = '<h2 style="color:#fff;font-size:1.9rem;margin-bottom:8px">' + esc(s.title) + '</h2>';
    if (s.lead) inner += '<p class="dim" style="margin-bottom:14px">' + esc(s.lead) + '</p>';
    inner += '<div style="margin-bottom:13px">';
    steps.slice(0, S.simStep).forEach(function(st){ inner += '<span class="crumb">' + esc(st.target) + '</span>'; });
    if (!done && s.hint) inner += '<span class="dim" style="font-size:.83rem">' + esc(s.hint) + '</span>';
    inner += '</div>';
    if (!done) {
      var st = steps[S.simStep];
      inner += '<div class="glass" style="padding:24px"><h3 style="color:#fff;text-align:center;margin-bottom:18px">' + esc(st.screenTitle) + '</h3><div class="simgrid">';
      (st.items||[]).forEach(function(it){
        var isT = it === st.target;
        inner += '<button class="simbtn ' + (isT?'target':'') + '" onclick="simClick(' + JSON.stringify(String(it)).replace(/"/g,'&quot;') + ')">' + esc(it) + '</button>';
      });
      inner += '</div></div>';
    } else {
      inner += '<div class="glass" style="padding:30px;text-align:center;border-color:var(--ok)"><div style="color:var(--ok);display:flex;justify-content:center;margin-bottom:12px">' + icon('check',44) + '</div><h3 style="color:#6ee7b7;font-size:1.3rem;margin-bottom:8px">' + esc(s.doneTitle) + '</h3><p class="dim">' + esc(s.doneDesc) + '</p></div>';
    }
  }
  else if (s.type === 'quiz') {
    var qs = s.questions || [];
    var score = 0;
    qs.forEach(function(q,i){ if (S.qAns[i] === q.correct) score++; });
    var passed = score >= qs.length - 1;
    gated = !(S.qShow && passed);
    inner = '<h2 style="color:#fff;font-size:1.9rem;margin-bottom:8px">' + esc(s.title) + '</h2>';
    if (s.lead) inner += '<p class="dim" style="margin-bottom:18px">' + esc(s.lead) + '</p>';
    if (S.qShow) {
      inner += '<div class="glass" style="padding:30px;text-align:center"><div style="display:flex;justify-content:center;margin-bottom:12px;color:' + (passed?'var(--ok)':'var(--err)') + '">' + icon(passed?'check':'x',48) + '</div>';
      inner += '<div style="font-size:2rem;font-weight:800;color:#fff;margin-bottom:7px">' + score + ' / ' + qs.length + '</div>';
      inner += '<p style="color:' + (passed?'#6ee7b7':'#fca5a5') + ';margin-bottom:18px">' + esc(passed ? (s.passText||'') : (s.retryText||'')) + '</p>';
      inner += '<button class="btn btn-g" onclick="qReset()">' + esc(s.retryBtn || P.ui.retry) + '</button></div>';
    } else {
      var q = qs[S.qIdx];
      var ans = S.qAns[S.qIdx];
      var answered = ans !== undefined;
      inner += '<div class="glass" style="padding:24px"><div class="dim" style="font-size:.83rem;margin-bottom:8px">' + (S.qIdx+1) + ' / ' + qs.length + '</div>';
      inner += '<h3 style="color:#fff;font-size:1.25rem;margin-bottom:16px">' + esc(q.q) + '</h3>';
      (q.opts||[]).forEach(function(o,i){
        var cls = 'qopt';
        if (answered) { if (i === q.correct) cls += ' ok'; else if (i === ans) cls += ' bad'; }
        inner += '<button class="' + cls + '" ' + (answered?'disabled':'') + ' onclick="qAnswer(' + i + ')">' + esc(o) + '</button>';
      });
      if (answered) inner += '<div style="margin-top:14px;text-align:end"><button class="btn btn-p" onclick="qNext()">' + esc(S.qIdx < qs.length-1 ? P.ui.next : P.ui.finish) + '</button></div>';
      inner += '</div>';
    }
  }
  else if (s.type === 'summary') {
    inner = '<div style="text-align:center;margin-bottom:26px"><div style="color:var(--accent);display:flex;justify-content:center;margin-bottom:12px">' + icon('sparkles',52) + '</div><h2 style="color:#fff;font-size:2.2rem">' + esc(s.title) + '</h2>';
    if (s.lead) inner += '<p class="dim" style="margin-top:8px">' + esc(s.lead) + '</p></div>';
    inner += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px">';
    inner += '<div class="glass" style="padding:20px"><h3 style="color:#fff;margin-bottom:11px">' + esc(s.learnedTitle||'') + '</h3>';
    (s.learned||[]).forEach(function(l){ inner += '<div class="chk"><span class="chki">' + icon('check',13) + '</span><span>' + esc(l) + '</span></div>'; });
    inner += '</div>';
    if (s.nextTitle) {
      inner += '<div class="glass" style="padding:20px;border-color:var(--accent)"><div style="color:var(--accent);font-weight:700;font-size:.82rem;margin-bottom:7px">' + esc(s.nextEyebrow||'') + '</div><h3 style="color:#fff;margin-bottom:9px">' + esc(s.nextTitle) + '</h3><p class="dim" style="font-size:.9rem;line-height:1.6">' + esc(s.nextDesc||'') + '</p></div>';
    }
    inner += '</div>';
    if (s.thanks) inner += '<p style="text-align:center;color:#fff;font-size:1.05rem;margin-top:26px">' + esc(s.thanks) + '</p>';
    inner += '<div style="display:flex;justify-content:center;gap:11px;margin-top:16px;flex-wrap:wrap">';
    inner += '<button class="btn btn-g" onclick="goSlide(0)">' + icon('play',14) + ' ' + esc(P.ui.restart) + '</button>';
    inner += '<button class="btn btn-p" onclick="finishChapter()">' + (S.chapter < CH().length-1 ? 'לפרק הבא' : 'סיים') + '</button>';
    inner += '</div>';
    return slideShell(inner, canPrev, false, false);
  }
  else { inner = '<p class="dim">unknown slide type: ' + esc(s.type) + '</p>'; }

  return slideShell(inner, canPrev, canNext, gated);
}

function hsClick(i){ if (S.hsDone.indexOf(i)<0) S.hsDone.push(i); S.hsActive = (S.hsActive===i ? null : i); render(); }
function simClick(item){
  var s = curSlides()[S.slide]; var st = (s.steps||[])[S.simStep];
  if (st && item === st.target) { S.simStep++; render(); }
}
function qAnswer(i){ if (S.qAns[S.qIdx] !== undefined) return; S.qAns[S.qIdx] = i; render(); }
function qNext(){
  var s = curSlides()[S.slide];
  if (S.qIdx < (s.questions||[]).length - 1) S.qIdx++; else S.qShow = true;
  render();
}
function qReset(){ S.qIdx=0; S.qAns={}; S.qShow=false; render(); }

function rDocs(){
  var D = P.docs, arts = D.articles || [];
  var h = '<div class="wrap fadeIn" style="padding-top:26px;padding-bottom:50px">';
  if (S.dArt) {
    var a = null; arts.forEach(function(x){ if (x.slug === S.dArt) a = x; });
    if (a) {
      var catL = ''; (D.categories||[]).forEach(function(c){ if (c.key===a.cat) catL = c.label; });
      h += '<button class="btn btn-g" style="margin-bottom:18px" onclick="S.dArt=null;render()">' + esc(P.ui.backToList) + '</button>';
      h += '<div class="dart"><div class="dtag">' + esc(catL) + '</div><h1>' + esc(a.title) + '</h1><p class="dim" style="margin-bottom:18px">' + esc(a.summary) + '</p>';
      (a.body||[]).forEach(function(b){
        if (b[0]==='p') h += '<p>' + esc(b[1]) + '</p>';
        else if (b[0]==='h2') h += '<h2>' + esc(b[1]) + '</h2>';
        else if (b[0]==='ul') { h += '<ul>'; (b[1]||[]).forEach(function(li){ h += '<li>' + esc(li) + '</li>'; }); h += '</ul>'; }
        else if (b[0]==='pre') h += '<pre>' + esc(b[1]) + '</pre>';
        else if (b[0]==='img') h += '<img class="txtimg" src="' + esc(b[1]) + '" alt="">';
      });
      h += '</div>';
      var rel = arts.filter(function(x){ return x.cat===a.cat && x.slug!==a.slug; }).slice(0,3);
      if (rel.length) {
        h += '<h3 style="color:#fff;margin:26px 0 13px">' + esc(P.ui.related) + '</h3><div class="dcards">';
        rel.forEach(function(r){ h += '<div class="dcard" onclick="S.dArt=' + JSON.stringify(r.slug).replace(/"/g,'&quot;') + ';render()"><h4 style="color:#fff;margin-bottom:5px">' + esc(r.title) + '</h4><p class="dim" style="font-size:.85rem">' + esc(r.summary) + '</p></div>'; });
        h += '</div>';
      }
      return h + '</div>';
    }
    S.dArt = null;
  }
  h += '<h1 style="color:#fff;font-size:1.9rem;text-align:center">' + esc(D.title) + '</h1>';
  h += '<div class="dsearch"><input value="' + esc(S.dSearch) + '" placeholder="' + esc(D.searchPlaceholder||'') + '" oninput="S.dSearch=this.value;renderDocsList()">' + icon('search',19) + '</div>';
  h += '<div class="dlayout"><aside class="dside"><div class="dim" style="font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:6px 11px">' + esc(P.ui.categories) + '</div>';
  var cats = [{key:'all', label:P.ui.allArticles}].concat(D.categories||[]);
  cats.forEach(function(c){
    var n = c.key==='all' ? arts.length : arts.filter(function(a){ return a.cat===c.key; }).length;
    h += '<div class="dcat ' + (S.dCat===c.key?'on':'') + '" onclick="S.dCat=' + JSON.stringify(c.key).replace(/"/g,'&quot;') + ';render()"><span>' + esc(c.label) + '</span><span class="dim" style="font-size:.78rem">' + n + '</span></div>';
  });
  h += '</aside><div id="docs-list">' + docsListHtml() + '</div></div></div>';
  return h;
}
function docsListHtml(){
  var D = P.docs, arts = D.articles || [];
  var q = S.dSearch.trim().toLowerCase();
  var list = arts.filter(function(a){
    if (S.dCat !== 'all' && a.cat !== S.dCat) return false;
    if (!q) return true;
    return (a.title + ' ' + a.summary + ' ' + JSON.stringify(a.body)).toLowerCase().indexOf(q) >= 0;
  });
  if (!list.length) return '<div class="glass" style="padding:26px;text-align:center" ><span class="dim">' + esc(P.ui.noResults) + '</span></div>';
  var h = '<div class="dcards">';
  list.forEach(function(a){
    var catL = ''; (D.categories||[]).forEach(function(c){ if (c.key===a.cat) catL = c.label; });
    h += '<div class="dcard" onclick="S.dArt=' + JSON.stringify(a.slug).replace(/"/g,'&quot;') + ';render()"><div class="dtag">' + esc(catL) + '</div><h3 style="color:#fff;font-size:1.02rem;margin-bottom:6px">' + esc(a.title) + '</h3><p class="dim" style="font-size:.87rem;line-height:1.5">' + esc(a.summary) + '</p></div>';
  });
  return h + '</div>';
}
function renderDocsList(){
  var el = document.getElementById('docs-list');
  if (el) el.innerHTML = docsListHtml();
}

function enabledSections(){ return ['marketing','lomda','docs'].filter(secOn); }

function render(){
  var app = document.getElementById('app');
  var only = enabledSections();
  if (only.length === 1 && S.route === 'portal') S.route = only[0];
  var body = '';
  if (S.route === 'portal') body = rPortal();
  else if (S.route === 'marketing') body = rMarketing();
  else if (S.route === 'lomda') body = rLomda();
  else if (S.route === 'docs') body = rDocs();
  app.innerHTML = topbar() + body;
  localizeDom(app);
}

(function init(){
  var c = P.branding.colors || {};
  var r = document.documentElement.style;
  if (c.accent) r.setProperty('--accent', c.accent);
  if (c.accent2) r.setProperty('--accent2', c.accent2);
  if (c.bg) r.setProperty('--bg', c.bg);
  if (c.bg2) r.setProperty('--bg2', c.bg2);
  if (c.text) r.setProperty('--text', c.text);
  if (c.dim) r.setProperty('--dim', c.dim);
  r.setProperty('--ok', '#10b981'); r.setProperty('--err', '#ef4444');
  document.documentElement.dir = (S.lang === 'he') ? 'rtl' : 'ltr';
  document.documentElement.lang = S.lang;
  document.title = P.branding.productName + ' — ' + P.branding.customerName;
  render();
})();
  
</script>
</body>
</html>
