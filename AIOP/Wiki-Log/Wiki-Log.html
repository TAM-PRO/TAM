<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WIKI-LOG - Radar Fault Log Knowledge Base</title>
  <style>
    :root{--bg:#03111d;--panel:#081b2a;--line:#294052;--soft:#142c3d;--cyan:#00d9f5;--text:#f4f7fb;--muted:#9da9b8;--red:#e31c2b}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 50% 32%,#0b3044 0,transparent 37%),linear-gradient(#041421,#020b13);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
    button,input,select{font:inherit}.top{height:58px;background:#0a1a2ae8;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 18px}.top strong{font-size:16px}.brand-logo{display:block;height:auto;object-fit:contain}.top-logo{justify-self:end;max-height:38px;width:86px}.title-logo{margin:0 auto;max-height:46px;width:108px}
    .title{text-align:center;padding:22px 15px}.title h1{font-size:40px;margin:20px 0 7px}.title p{color:var(--muted);font-size:18px;margin:0}.toolbar{max-width:680px;margin:0 auto 18px;padding:0 15px}.search{height:51px;border:1px solid #00d9f5b8;border-radius:28px;background:#0c1d2bc4;display:flex;align-items:center;padding:0 20px}.search:before{content:"";width:17px;height:17px;border:2px solid var(--text);border-radius:50%;margin-right:14px}.search input{width:100%;background:none;border:0;outline:0;color:var(--text)}
    .grid{display:grid;grid-template-columns:290px minmax(480px,1fr) minmax(360px,.85fr);gap:9px;margin:0 3vw}.panel{background:#071927c7;border:1px solid var(--line);min-height:540px;padding:24px}.filters{border-radius:12px 0 0 12px}.results{border-radius:0 12px 12px 0}.detail{border-radius:12px}.panel h2{font-size:19px;margin:0 0 18px;padding-bottom:11px;border-bottom:1px solid var(--soft)}label{display:block;color:#d3dae2;font-size:14px;margin:0 0 7px}.filters select{width:100%;height:43px;background:#122738c7;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:0 12px;margin-bottom:17px}.station-list{display:grid;gap:4px}.station{display:flex;align-items:center;gap:10px;min-height:38px;border:1px solid var(--line);border-radius:5px;padding:0 10px;background:#0c1f2fb8}.station input{accent-color:var(--cyan)}
    .headers,.row{display:grid;grid-template-columns:150px minmax(240px,1fr) 120px;gap:15px;align-items:center}.headers{color:var(--muted);font-size:14px;padding:10px 14px}.row{width:100%;min-height:64px;border:1px solid transparent;border-bottom-color:var(--soft);background:none;color:#d9e0e8;text-align:left;padding:0 14px;cursor:pointer}.row:hover{background:#00d9f50a}.row.active{border-color:#00d9f5b8;border-radius:6px;background:#00d9f509}.row.active span:first-child,.detail-id{color:var(--cyan)}.empty{color:var(--muted);padding:60px 15px;text-align:center}
    .detail-id{font-size:20px;margin:0 0 12px}.detail>h2{border:0;font-size:23px;padding:0}.tags{display:flex;gap:8px}.tags span{background:#74899b29;border-radius:5px;padding:7px 12px;font-size:14px}.tags span:last-child{color:var(--cyan);background:#00d9f517}.section{border-top:1px solid var(--soft);margin-top:18px;padding-top:18px}.section h3{font-size:18px;margin:0 0 8px}.section p{color:var(--muted);line-height:1.55;margin:0}.solutions{display:grid;gap:7px}.solution{display:grid;grid-template-columns:1fr auto;align-items:center;min-height:44px;padding:0 13px;border:1px solid #00d9f594;border-radius:5px;color:var(--cyan);text-decoration:none}.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.images figure{margin:0}.images img{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--line);border-radius:5px}.images figcaption{color:var(--muted);font-size:12px;margin-top:5px}.updated{color:var(--muted);font-size:14px;border-top:1px solid var(--soft);padding-top:15px;margin-top:18px}.footer{text-align:center;color:#dce4ec;font-style:italic;font-size:19px;padding:18px}
    @media(max-width:1050px){.grid{grid-template-columns:270px 1fr}.detail{grid-column:1/-1;min-height:0}.headers,.row{grid-template-columns:125px 1fr 110px}}
    @media(max-width:700px){.top{grid-template-columns:1fr auto}.top>span:first-child{display:none}.top-logo{max-height:32px;width:72px}.grid{grid-template-columns:1fr;margin:0 14px}.filters,.results,.detail{border-radius:8px;min-height:0}.headers{display:none}.row{grid-template-columns:1fr auto;gap:5px 10px;padding:12px}.row span:nth-child(2){grid-column:1/-1;grid-row:2}.title h1{font-size:34px}}
  </style>

  <div class="toolbar"><label class="search"><input id="search" placeholder="Search by log number, name or keyword..."></label></div>
  <main class="grid">
    <aside class="panel filters"><h2>FILTERS</h2><label for="radar">Radar Type</label><select id="radar"></select><label for="category">Categories</label><select id="category"></select><label>Station</label><div class="station-list" id="stations"></div></aside>
    <section class="panel results"><h2>Test Fail Results</h2><div class="headers"><span>Test ID</span><span>Test Failure Name</span><span>Category</span></div><div id="rows"></div></section>
    <aside class="panel detail" id="detail"></aside>
  </main>
  <footer class="footer">TAM Projects</footer>
  <script>
    const logs=[{"id":"LOG-1047","name":"Power Supply Communication Failure","category":"Electrical","radarType":"aCHR","stations":["Initial Station","Pre Calib","ESS"],"explanation":"Communication with the power supply unit was interrupted during initialization. Check power input, harness continuity and controller status.","updated":"2025-05-06","solutions":[{"label":"Open Troubleshooting Flow","url":"#","icon":"flow"},{"label":"View Technical Procedure","url":"#","icon":"document"},{"label":"Functional Description","url":"#","icon":"document"}],"images":[]},{"id":"LOG-0872","name":"Antenna Position Error","category":"Mechanical","radarType":"aCHR","stations":["Initial Station","Pre Calib","Calib"],"explanation":"The antenna position feedback is outside the permitted tolerance. Inspect the positioning mechanism, encoder alignment and mechanical limits.","updated":"2025-04-28","solutions":[{"label":"Open Positioning Diagnostic","url":"#","icon":"flow"},{"label":"View Alignment Procedure","url":"#","icon":"document"},{"label":"Mechanical Interface Description","url":"#","icon":"document"}],"images":[]},{"id":"LOG-1126","name":"Receiver Temperature Warning","category":"Electronics","radarType":"aCHR","stations":["Oven","ESS"],"explanation":"Receiver temperature crossed the warning threshold during the test cycle. Verify airflow, ambient conditions and sensor readings.","updated":"2025-05-02","solutions":[{"label":"Open Thermal Check Flow","url":"#","icon":"flow"},{"label":"View Cooling Procedure","url":"#","icon":"document"},{"label":"Receiver Functional Description","url":"#","icon":"document"}],"images":[]},{"id":"LOG-0954","name":"Servo Feedback Mismatch","category":"Mechanical","radarType":"aCHR","stations":["Pre Calib","ESS","Calib"],"explanation":"Commanded servo movement does not match the measured feedback. Check servo cabling, encoder values and drive calibration.","updated":"2025-04-22","solutions":[{"label":"Open Servo Diagnostic Flow","url":"#","icon":"flow"},{"label":"View Servo Calibration","url":"#","icon":"document"},{"label":"Servo System Description","url":"#","icon":"document"}],"images":[]}];
    const state={query:"",radar:"All Radar Types",category:"All Categories",stations:new Set()};
    const allStations=[...new Set(logs.flatMap(x=>x.stations))];
    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    const radar=document.getElementById("radar"),category=document.getElementById("category"),stations=document.getElementById("stations"),rows=document.getElementById("rows"),detail=document.getElementById("detail");
    radar.innerHTML=["All Radar Types",...new Set(logs.map(x=>x.radarType))].map(x=>'<option>'+escapeHtml(x)+'</option>').join("");
    category.innerHTML=["All Categories",...new Set(logs.map(x=>x.category))].map(x=>'<option>'+escapeHtml(x)+'</option>').join("");
    stations.innerHTML=allStations.map(x=>'<label class="station"><input type="checkbox" value="'+escapeHtml(x)+'">'+escapeHtml(x)+'</label>').join("");
    let selected=logs[0]?.id;
    function filtered(){return logs.filter(x=>{const text=(x.id+' '+x.name+' '+x.category+' '+x.explanation).toLowerCase();return text.includes(state.query)&& (state.radar==="All Radar Types"||x.radarType===state.radar)&& (state.category==="All Categories"||x.category===state.category)&& (!state.stations.size||x.stations.some(s=>state.stations.has(s)));});}
    function render(){const list=filtered();if(!list.some(x=>x.id===selected))selected=list[0]?.id;rows.innerHTML=list.length?list.map(x=>'<button class="row '+(x.id===selected?'active':'')+'" data-id="'+escapeHtml(x.id)+'"><span>'+escapeHtml(x.id)+'</span><span>'+escapeHtml(x.name)+'</span><span>'+escapeHtml(x.category)+'</span></button>').join(""):'<div class="empty">No matching test failures</div>';const x=logs.find(x=>x.id===selected);if(!x){detail.innerHTML='<div class="empty">Select a fault log</div>';return;}const solutions=(x.solutions||[]).map(s=>'<a class="solution" href="'+escapeHtml(s.url||'#')+'" target="_blank" rel="noreferrer"><span>'+escapeHtml(s.label)+'</span><span>↗</span></a>').join("");const images=(x.images||[]).map(i=>'<figure><img src="'+escapeHtml(i.url)+'" alt="'+escapeHtml(i.alt)+'"><figcaption>'+escapeHtml(i.caption)+'</figcaption></figure>').join("");detail.innerHTML='<p class="detail-id">'+escapeHtml(x.id)+'</p><h2>'+escapeHtml(x.name)+'</h2><div class="tags"><span>'+escapeHtml(x.radarType)+'</span><span>'+escapeHtml(x.category)+'</span></div><section class="section"><h3>Test Name Explanation</h3><p>'+escapeHtml(x.explanation)+'</p></section>'+(solutions?'<section class="section"><h3>RELATED SOLUTIONS</h3><div class="solutions">'+solutions+'</div></section>':'')+(images?'<section class="section"><h3>IMAGES</h3><div class="images">'+images+'</div></section>':'')+'<div class="updated">Last updated: '+escapeHtml(x.updated)+'</div>';}
    document.getElementById("search").addEventListener("input",e=>{state.query=e.target.value.trim().toLowerCase();render()});radar.addEventListener("change",e=>{state.radar=e.target.value;render()});category.addEventListener("change",e=>{state.category=e.target.value;render()});stations.addEventListener("change",e=>{e.target.checked?state.stations.add(e.target.value):state.stations.delete(e.target.value);render()});rows.addEventListener("click",e=>{const row=e.target.closest("[data-id]");if(row){selected=row.dataset.id;render()}});render();
  </script>
